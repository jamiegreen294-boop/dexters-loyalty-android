name: Force Vercel production commit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-vercel-production.yml'
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create build-relevant production trigger
        run: |
          git config user.name "jamiegreen294-boop"
          git config user.email "jamiegreen294@gmail.com"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.deploymentMarker='spin-app-only-live-20260905';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          git add package.json
          git commit -m "Deploy Spin to Win app-only flow to production"
          git push origin main
