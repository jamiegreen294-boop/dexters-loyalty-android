name: Shared Spin Test Check
on:
  push:
    branches: [test/shared-spin-universal-qr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEXTERS_QA_ROOT: ${{ github.workspace }}/.qa-node
      DEXTERS_QA_MODULES: ${{ github.workspace }}/.qa-node/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p "$DEXTERS_QA_ROOT" && npm install --prefix "$DEXTERS_QA_ROOT" --no-save jsdom@26 jsqr@1.4.0
      - run: npm run build
      - run: npm run test:shared-spin
      - run: npm run test:combined
      - run: npm run test:auth-return
      - run: grep -q 'sharedSpinIntegrationTest' dist/index.html
      - run: grep -q 'shared_spin_test_spin' dist/index.html
      - run: grep -q 'shared_spin_test_qr_action' dist/index.html
