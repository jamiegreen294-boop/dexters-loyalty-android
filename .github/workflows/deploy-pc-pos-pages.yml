name: Build PC POS Test

on:
  push:
    branches:
      - dexters-pos-pc-test-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-pos-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PC POS test branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build isolated PC POS
        run: npm run build

      - name: Build GitHub Pages test bundle
        run: node build-pc-pos-pages.cjs

      - name: Verify PC POS output and controls
        run: |
          test -f _site/index.html
          test -f _site/pos-pc-v3-addon.js
          test -f _site/pos-pc-session-security.js
          test -f _site/pos-pc-offline.js
          test -f _site/pos-pc-whatsapp.js
          test -f _site/pos-pc-xepos-plus.js
          test -f _site/pos-pc-promotions-auto.js
          test -f _site/pos-pc-recipes.js
          test -f _site/pos-pc-purchasing.js
          test -f _site/pos-pc-expiry.js
          test -f _site/pos-pc-account-statements.js
          test -f _site/customer-display.html
          grep -q "uber-table-service-pc-test-api" _site/index.html
          grep -q "pos-pc-session-security.js" _site/index.html
          grep -q "pos-pc-offline.js" _site/index.html
          grep -q "Supplier Purchase Orders" _site/pos-pc-purchasing.js
          grep -q "Ingredient Recipes" _site/pos-pc-recipes.js
          grep -q "Money Owed · Statements" _site/pos-pc-account-statements.js
