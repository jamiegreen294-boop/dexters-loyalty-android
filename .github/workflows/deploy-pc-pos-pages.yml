name: Deploy PC POS Test to GitHub Pages

on:
  push:
    branches:
      - dexters-pos-pc-test-v3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pc-pos-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PC POS test branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build isolated PC POS
        run: npm run build

      - name: Build GitHub Pages site
        run: node build-pc-pos-pages.cjs

      - name: Verify Pages output and POS controls
        run: |
          test -f _site/index.html
          test -f _site/pos-pc-v3-addon.js
          test -f _site/pos-pc-category-home.js
          test -f _site/pos-order-management.js
          test -f _site/pos-pc-manager.js
          test -f _site/pos-pc-table-payments.js
          grep -q "pos-order-management.js" _site/index.html
          grep -q "pos-pc-category-home.js" _site/index.html
          grep -q "pos-pc-manager.js" _site/index.html
          grep -q "pos-pc-table-payments.js" _site/index.html
          grep -q "uber-table-service-pc-test-api" _site/index.html
          grep -q "Held Orders" _site/pos-order-management.js
          grep -q "Table Orders" _site/pos-order-management.js
          grep -q "QR Orders" _site/pos-order-management.js
          grep -q "Square Payment" _site/pos-pc-manager.js
          grep -q "Refunds / Voids" _site/pos-pc-manager.js
          grep -q "Manager PIN" _site/pos-pc-manager.js
          grep -q "Cash Drawer" _site/pos-pc-manager.js
          grep -q "PART PAY / SPLIT BILL" _site/pos-pc-table-payments.js
          grep -q "PAYMENT HISTORY" _site/pos-pc-table-payments.js
          grep -q "CLOSE ACCOUNT" _site/pos-pc-table-payments.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
