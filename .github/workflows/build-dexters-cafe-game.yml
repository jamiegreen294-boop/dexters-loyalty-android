name: Build Dexter's Cafe Game APK

on:
  push:
    branches:
      - dexters-cafe-game-retail-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Recreate Dexter's Cafe Manager project
        shell: bash
        run: |
          cat cafe-game-buildsrc.part00 cafe-game-buildsrc.part01 cafe-game-buildsrc.part02 | base64 -d > /tmp/dexters-cafe-game.zip
          mkdir -p cafe-game-retail
          unzip -q /tmp/dexters-cafe-game.zip -d cafe-game-retail
          test -f cafe-game-retail/settings.gradle.kts
          test -f cafe-game-retail/app/build.gradle.kts
          test -f cafe-game-retail/app/src/main/AndroidManifest.xml
          test -f cafe-game-retail/app/src/main/assets/game/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: cafe-game-retail
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          test -s cafe-game-retail/app/build/outputs/apk/debug/app-debug.apk
          sha256sum cafe-game-retail/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dexters-spot-cafe-manager-debug-apk
          path: cafe-game-retail/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
