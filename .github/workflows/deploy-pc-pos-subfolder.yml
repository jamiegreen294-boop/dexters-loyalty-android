name: Deploy PC POS Test Subfolder

on:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/deploy-pc-pos-subfolder.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pc-pos-gh-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing Pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Checkout PC POS source
        uses: actions/checkout@v4
        with:
          ref: dexters-pos-pc-test-v3
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build verified PC POS test
        working-directory: source
        run: |
          npm install --no-audit --no-fund
          npm run build
          node build-pc-pos-pages.cjs

      - name: Preserve current Pages site and add PC POS test
        run: |
          rm -rf site/pc-pos-test
          mkdir -p site/pc-pos-test
          cp -a source/_site/. site/pc-pos-test/
          test -f site/CNAME
          test -f site/pc-pos-test/index.html
          test -f site/pc-pos-test/pos-pc-session-security.js
          test -f site/pc-pos-test/pos-pc-offline.js
          test -f site/pc-pos-test/pos-pc-whatsapp.js
          test -f site/pc-pos-test/pos-pc-xepos-plus.js
          test -f site/pc-pos-test/pos-pc-recipes.js
          test -f site/pc-pos-test/pos-pc-purchasing.js
          test -f site/pc-pos-test/pos-pc-expiry.js
          test -f site/pc-pos-test/pos-pc-account-statements.js
          test -f site/pc-pos-test/customer-display.html
          grep -q "uber-table-service-pc-test-api" site/pc-pos-test/index.html
          grep -q "WhatsApp Inbox" site/pc-pos-test/pos-pc-whatsapp.js
          grep -q "Money Owed · Statements" site/pc-pos-test/pos-pc-account-statements.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preserved Pages site with PC POS test
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
