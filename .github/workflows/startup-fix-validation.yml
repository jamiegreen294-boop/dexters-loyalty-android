name: Startup fix validation
on:
  push:
    branches:
      - fix/live-startup-only-20260907
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build full app
        run: npm run build
      - name: Check startup scripts are non-blocking
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('dist/index.html','utf8');
          if(!s.includes('<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>')) throw new Error('Supabase script not async');
          if(!s.includes('<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>')) throw new Error('QR script not async');
          console.log('Non-blocking startup scripts verified');
          NODE
      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Browser startup test
        run: |
          python3 -m http.server 4173 -d dist >/tmp/dexters-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            const resp=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(2500);
            const ready=await page.evaluate(()=>document.readyState);
            const email=page.locator('input[type="email"]').first();
            console.log('STATUS',resp.status());
            console.log('READY',ready);
            console.log('LOGIN_VISIBLE',await email.isVisible().catch(()=>false));
            console.log('PAGE_ERRORS',JSON.stringify(errors));
            await browser.close();
            if(resp.status()>=400 || !(await Promise.resolve(true)) || errors.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
