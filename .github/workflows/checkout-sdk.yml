name: Build Dexter Checkout SDK
on:
  push:
    branches: [codex/foodhub-mobile-payments-sdk-20261005]
    paths: ['checkout-sdk/**', '.github/workflows/checkout-sdk.yml', 'supabase/functions/dexters-checkout-sdk/**', 'tests/checkout-sdk/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify payment result checks
        run: node --experimental-strip-types --test tests/checkout-sdk/*.test.mjs
      - name: Build SDK checkout
        run: gradle -p checkout-sdk --no-daemon assembleDebug
      - name: Verify certificate
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs checkout-sdk/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Dexter-Checkout-SDK
          path: checkout-sdk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
