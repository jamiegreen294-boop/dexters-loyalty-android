name: Build Dexter Checkout SDK
on:
  push:
    branches: [codex/foodhub-mobile-payments-sdk-20261005]
    paths: ['checkout-sdk/**', '.github/workflows/checkout-sdk.yml', 'supabase/functions/pc-pos-square-bridge/**', 'tests/checkout-sdk/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify payment result checks
        run: node --experimental-strip-types --test tests/checkout-sdk/*.test.mjs
      - name: Restore checkout signing certificate
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dexters-checkout-sdk-signing-v1
      - name: Ensure checkout signing certificate exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Dexter Checkout,O=Dexters,C=GB'
          fi
      - name: Build SDK checkout
        run: gradle -p checkout-sdk --no-daemon assembleDebug
      - name: Verify certificate
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs checkout-sdk/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Dexter-Checkout-SDK
          path: checkout-sdk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
