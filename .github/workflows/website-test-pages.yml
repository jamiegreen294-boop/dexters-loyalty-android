name: Dexter's Website Test - GitHub Pages

on:
  push:
    branches:
      - website-seasonal-test
    paths:
      - 'website-test/**'
      - '.github/workflows/website-test-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dexters-website-test-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website test
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website-test
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
