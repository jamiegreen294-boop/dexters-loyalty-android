name: Build Dexter's Proper Cafe Game v2

on:
  push:
    branches:
      - dexters-proper-cafe-game-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify corrected source archive
        run: echo "a3d35292b0d81d57c4b536231bd995731fb40140dd9533bdf9a41e885393d95f  proper-game-v2-alpha1b.zip" | sha256sum -c -
      - name: Extract game
        run: mkdir game && unzip -q proper-game-v2-alpha1b.zip -d game
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: game
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s game/app/build/outputs/apk/debug/app-debug.apk
          sha256sum game/app/build/outputs/apk/debug/app-debug.apk
      - name: Emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r game/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n uk.co.dextersspot.cafegame/.MainActivity
            sleep 5
            adb shell pidof uk.co.dextersspot.cafegame
            adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime|dextersspot|cafegame" | tail -200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dexters-proper-cafe-game-v2-alpha1b-apk
          path: game/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
