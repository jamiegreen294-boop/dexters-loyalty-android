name: Checkout SDK Debug

on:
  push:
    branches:
      - codex/foodhub-mobile-payments-sdk-20261005
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build checkout debug APK
        run: gradle -p checkout-sdk :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dexters-checkout-debug
          path: checkout-sdk/app/build/outputs/apk/debug/app-debug.apk
