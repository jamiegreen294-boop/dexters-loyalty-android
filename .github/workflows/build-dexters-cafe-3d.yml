name: Build Dexter's Cafe 3D APK

on:
  push:
    branches:
      - dexters-cafe-3d-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4
    defaults:
      run:
        working-directory: dexters-cafe-3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export environment
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates
          mkdir -p /github/home/.config
          rm -rf /github/home/.config/godot
          mv /root/.config/godot /github/home/.config/godot
          mv /root/.local/share/godot/export_templates/4.4.stable /github/home/.local/share/godot/export_templates/4.4.stable
          mkdir -p /github/home/.android build
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
          if [ ! -f /github/home/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /github/home/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Dexters,C=GB"
          fi
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.1"
          java -version
          godot --version

      - name: Parse-check project
        run: godot --headless --editor --quit

      - name: Export Android debug APK
        run: godot --headless --verbose --export-debug "Android" build/Dexters-Cafe-3D.apk

      - name: Verify APK
        run: |
          test -s build/Dexters-Cafe-3D.apk
          sha256sum build/Dexters-Cafe-3D.apk
          ls -lh build/Dexters-Cafe-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dexters-cafe-3d-v1-apk
          path: dexters-cafe-3d/build/Dexters-Cafe-3D.apk
          if-no-files-found: error
          retention-days: 7
