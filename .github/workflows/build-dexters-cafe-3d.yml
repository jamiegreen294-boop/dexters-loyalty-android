name: Build Dexter's Cafe 3D APK

on:
  push:
    branches:
      - dexters-cafe-3d-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    defaults:
      run:
        working-directory: dexters-cafe-3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/templates/4.4.stable ]; then
            cp -r /root/.local/share/godot/templates/4.4.stable ~/.local/share/godot/export_templates/4.4.stable
          elif [ -d /root/.local/share/godot/export_templates/4.4.stable ]; then
            true
          fi
          mkdir -p build

      - name: Parse-check project
        run: godot --headless --editor --quit

      - name: Export Android debug APK
        run: godot --headless --verbose --export-debug "Android" build/Dexters-Cafe-3D.apk

      - name: Verify APK
        run: |
          test -s build/Dexters-Cafe-3D.apk
          sha256sum build/Dexters-Cafe-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dexters-cafe-3d-v1-apk
          path: dexters-cafe-3d/build/Dexters-Cafe-3D.apk
          if-no-files-found: error
          retention-days: 7
