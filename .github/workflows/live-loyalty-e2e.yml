name: Live loyalty E2E
on:
  push:
    paths:
      - '.github/workflows/live-loyalty-e2e.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile every live inline script
        run: |
          node <<'NODE'
          function compile(name,code){try{new Function(code);console.log('OK',name);return true}catch(e){console.log('FAIL',name,e.message);console.log('---SCRIPT START---');console.log(code);console.log('---SCRIPT END---');return false}}
          (async()=>{
            const html=await (await fetch('https://app.dextersspot.co.uk/app.html?v=syntax-'+Date.now(),{cache:'no-store'})).text();
            const scripts=[...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)];
            let ok=true;
            for(let i=0;i<scripts.length;i++){
              const attrs=scripts[i][1]||'',body=scripts[i][2]||'';
              if(/\bsrc\s*=/.test(attrs)||!body.trim()) continue;
              if(!compile('inline-'+i,body)) ok=false;
            }
            const auth=await (await fetch('https://app.dextersspot.co.uk/app-auth.js?v='+Date.now(),{cache:'no-store'})).text();
            if(!compile('app-auth.js',auth)) ok=false;
            if(!ok) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
