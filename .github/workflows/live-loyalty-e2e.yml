name: Live loyalty E2E
on:
  push:
    paths:
      - '.github/workflows/live-loyalty-e2e.yml'
      - 'postprocess-login-recovery.cjs'
      - 'build-pwa-shell.js'
  workflow_dispatch:
jobs:
  test-live-login:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real live login journey
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const SUPA='https://bpnkouymdvcogeaqjmxl.supabase.co';
          const KEY='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';
          const email=`jamiegreen294+dexters-e2e-${Date.now()}@gmail.com`;
          const password='Dx!'+Math.random().toString(36).slice(2)+'Aa9';
          (async()=>{
            const signup=await fetch(SUPA+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{full_name:'Dexters E2E Test'}})});
            const sd=await signup.json().catch(()=>({}));
            console.log('signup status',signup.status,'session',!!sd.access_token,'confirmed',!!sd.user?.email_confirmed_at);
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            page.on('console',m=>console.log('browser:',m.type(),m.text()));
            page.on('pageerror',e=>console.log('pageerror:',e.message));
            await page.goto('https://app.dextersspot.co.uk/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForURL(/app\.html/,{timeout:10000});
            await page.locator('#loginEmail').fill(email);
            await page.locator('#loginPassword').fill(password);
            await page.locator('#loginBtn').click();
            await page.waitForTimeout(1200);
            const status=(await page.locator('#status').innerText().catch(()=>''));
            console.log('status:',status);
            const appVisible=await page.locator('#appView').evaluate(el=>!el.classList.contains('hidden')).catch(()=>false);
            const homeVisible=await page.locator('#homePage').evaluate(el=>!el.classList.contains('hidden')).catch(()=>false);
            console.log('appVisible',appVisible,'homeVisible',homeVisible,'url',page.url());
            if(!appVisible||!homeVisible) throw new Error('LIVE LOGIN FAILED: '+status);
            const greeting=await page.locator('#greeting').innerText().catch(()=> '');
            console.log('greeting:',greeting);
            await page.locator('[data-page="qrPage"]').click();
            await page.waitForTimeout(700);
            const rewardsVisible=await page.locator('#qrPage').evaluate(el=>!el.classList.contains('hidden'));
            if(!rewardsVisible) throw new Error('Rewards page did not open');
            await page.locator('[data-page="menuPage"]').click();
            await page.waitForTimeout(700);
            const menuVisible=await page.locator('#menuPage').evaluate(el=>!el.classList.contains('hidden'));
            if(!menuVisible) throw new Error('Menu page did not open');
            console.log('LIVE E2E PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
