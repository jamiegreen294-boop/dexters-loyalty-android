name: Build Dexters POS Tablet APK

on:
  push:
    branches: [ dexters-pos-tablet-live ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable POS signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dexters-pos-signing-v1

      - name: Ensure stable POS signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Dexters POS,O=Dexters,C=GB"
          fi

      - name: Validate POS JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          js = html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/pos.js').write_text(js)
          PY
          node --check /tmp/pos.js

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dexters-POS-Tablet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexters-POS-Tablet-APK
          path: Dexters-POS-Tablet.apk
          if-no-files-found: error
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dexters-pos-latest
          name: Dexters POS Latest
          prerelease: false
          make_latest: true
          files: Dexters-POS-Tablet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}