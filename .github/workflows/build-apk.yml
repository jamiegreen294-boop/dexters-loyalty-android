name: Build Dexters Loyalty APK

on:
  push:
    branches: [ main, fix-mobile-full-width-20260910 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Dexters-Loyalty-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexters-Loyalty-Test-APK
          path: Dexters-Loyalty-Test.apk
          if-no-files-found: error
