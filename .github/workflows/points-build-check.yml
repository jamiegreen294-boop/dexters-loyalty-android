name: Points Build Check
on:
  push:
    branches: [test-live-points-system]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: grep -q 'dextersPointsLiveScript' dist/index.html
      - run: grep -q 'dxStaffPointsCard' dist/index.html
      - run: grep -q 'dxRewardsPointsCard' dist/index.html
