<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dexter's POS · Sunday Roast</title>
<style>
:root{--bg:#07111f;--panel:#10213a;--panel2:#0b192b;--line:#31506f;--text:#f7fbff;--muted:#9eb0c5;--accent:#ffd43b;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 14px;background:#08182a;border-bottom:1px solid var(--line)}
.brand{font-size:22px;font-weight:1000}.tag{background:var(--accent);color:#08101d;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:1000}.spacer{flex:1}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:1000;background:var(--accent);color:#08101d}.secondary{background:#213954;color:#fff}.danger{background:#5a1420;color:#fff}.ok{background:#1f7a49;color:#fff}
.wrap{padding:14px;max-width:1200px;margin:auto}.filters{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#09182a;color:#fff}
.grid{display:grid;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.head{display:flex;gap:10px;align-items:flex-start}.head h3{margin:0 0 5px}.meta{color:var(--muted);font-size:13px}.paystate{margin-left:auto;text-align:right;font-weight:1000}.due{color:#ffd43b}.paid{color:#8ff0b3}.items{margin:10px 0;padding:10px;background:var(--panel2);border-radius:11px}.items div{padding:4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:center;padding:14px}.hide{display:none}.box{width:min(560px,96vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.summary{background:var(--panel2);border-radius:12px;padding:12px;margin:10px 0}.big{font-size:28px;font-weight:1000}.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{min-height:22px;color:var(--muted);margin-top:10px}.badtext{color:#ffb0b9}@media(max-width:650px){.filters,.paygrid{grid-template-columns:1fr}.head{display:block}.paystate{text-align:left;margin:8px 0 0}}
</style>
</head>
<body>
<header class="top"><div class="brand">Dexter's POS</div><span class="tag">SUNDAY ROAST</span><div class="spacer"></div><button id="refreshBtn" class="btn secondary">Refresh</button><button id="closeBtn" class="btn secondary">Back to POS</button></header>
<main class="wrap">
 <div class="filters"><input id="date" class="field" type="date"><button id="loadBtn" class="btn">Load Sunday</button></div>
 <div id="status" class="status">Loading Sunday Roast orders…</div>
 <section id="orders" class="grid"></section>
</main>
<div id="payModal" class="modal hide"><div class="box">
 <h2 id="payTitle">Take payment</h2>
 <div id="payDetails" class="summary"></div>
 <div class="paygrid"><button id="cashPay" class="btn ok">CASH</button><button id="cardPay" class="btn">SQUARE CARD</button></div>
 <button id="cancelPay" class="btn secondary" style="width:100%;margin-top:10px">Cancel</button>
 <div id="payMsg" class="status"></div>
</div></div>
<script>
(()=>{'use strict';
const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';
const API=U+'/functions/v1/sunday-roast-pc-pos-api',SQ=U+'/functions/v1/pc-pos-square-bridge';
const $=id=>document.getElementById(id),mp=p=>'£'+(Number(p||0)/100).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let orders=[],paying=null;
function session(){try{return JSON.parse(localStorage.getItem('dexters-pos-session')||'null')}catch{return null}}
function token(){return session()?.access_token||''}
function headers(){const t=token();if(!t)throw Error('POS session not found. Open this tab from the signed-in Dexter\'s POS.');return{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'}}
async function api(body){const r=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Sunday Roast request failed');return d}
async function square(body){const r=await fetch(SQ,{method:'POST',headers:headers(),body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Square payment request failed');return d}
function paid(o){return Math.max(0,Number(o.total_pence||0)-Number(o.balance_pence||0))}
function paymentText(o){const bal=Number(o.balance_pence||0);return bal>0?'DEPOSIT/PAID '+mp(paid(o))+' · DUE '+mp(bal):'PAID IN FULL'}
function card(o){const closed=['collected','rejected','no_show','payment_failed'].includes(String(o.status||''));const status=String(o.status||'pending');return '<article class="card"><div class="head"><div><h3>SR-'+String(o.order_number||'').padStart(3,'0')+' · '+esc(o.customer_name||'Customer')+'</h3><div class="meta">'+esc(o.collection_slot||'')+' · '+esc(o.customer_phone||'No phone')+(o.customer_id?' · Loyalty customer':' · Walk-in / non-loyalty')+'</div></div><div class="paystate '+(Number(o.balance_pence||0)>0?'due':'paid')+'">'+paymentText(o)+'</div></div><div class="items">'+(o.items||[]).map(i=>'<div>'+Number(i.qty||0)+' × '+esc(i.name)+'</div>').join('')+'</div><div class="meta">Total '+mp(o.total_pence)+' · Status '+esc(status.toUpperCase())+(o.order_notes?'<br>Note: '+esc(o.order_notes):'')+'</div><div class="actions">'+(!closed&&status==='pending'?'<button class="btn" data-act="approve" data-id="'+o.id+'">APPROVE</button>':'')+(!closed&&status!=='ready'?'<button class="btn secondary" data-act="ready" data-id="'+o.id+'">READY</button>':'')+(!closed?'<button class="btn ok" data-act="collect" data-id="'+o.id+'">COLLECT</button>':'')+'</div></article>'}
function render(){$('orders').innerHTML=orders.length?orders.map(card).join(''):'<div class="empty">No Sunday Roast orders found for this date.</div>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handle(b.dataset.act,orders.find(o=>o.id===b.dataset.id)))}
async function load(){
 try{$('status').textContent='Loading…';if(!token())throw Error('Please open Sunday Roast from the signed-in POS.');let date=$('date').value;if(!date){const s=await api({action:'status'});date=s.settings?.collection_date||'';$('date').value=date}const r=await api({action:'list',collection_date:date});orders=r.orders||[];render();$('status').textContent=orders.length+' Sunday Roast order'+(orders.length===1?'':'s')+' loaded.'}catch(e){$('status').textContent=e.message;$('status').className='status badtext'}}
async function statusChange(o,status){await api({action:'status_change',id:o.id,status});await load()}
async function handle(action,o){if(!o)return;try{if(action==='approve'){await statusChange(o,'booked');return}if(action==='ready'){await statusChange(o,'ready');return}if(action==='collect'){if(Number(o.balance_pence||0)>0){openPay(o);return}await statusChange(o,'collected')}}catch(e){alert(e.message)}}
function openPay(o){paying=o;$('payTitle').textContent='Collect SR-'+String(o.order_number||'').padStart(3,'0');$('payDetails').innerHTML='<b>'+esc(o.customer_name||'Customer')+'</b><br>'+esc(o.collection_slot||'')+'<div class="big">'+mp(o.balance_pence)+'</div><div>Outstanding balance due before collection</div><div style="margin-top:8px">'+(o.items||[]).map(i=>Number(i.qty||0)+' × '+esc(i.name)).join('<br>')+'</div>';$('payMsg').textContent='';$('payModal').classList.remove('hide')}
function closePay(){paying=null;$('payModal').classList.add('hide')}
async function markBalancePaidAndCollect(){await api({action:'payment',id:paying.id});await api({action:'status_change',id:paying.id,status:'collected'});closePay();await load()}
async function cashPayment(){if(!paying)return;try{$('payMsg').textContent='Recording cash payment…';await markBalancePaidAndCollect()}catch(e){$('payMsg').textContent=e.message;$('payMsg').className='status badtext'}}
async function cardPayment(){
 if(!paying)return;
 const o=paying,amount=Number(o.balance_pence||0);if(amount<=0)return;
 try{
   $('payMsg').className='status';$('payMsg').textContent='Sending '+mp(amount)+' to Square…';
   const x=await square({action:'create',amount_pence:amount,reference:'Sunday Roast SR-'+String(o.order_number||'').padStart(3,'0')+' · '+String(o.customer_name||'Customer')});
   const id=x.request?.id;if(!id)throw Error('Square payment request was not created.');
   const deadline=Date.now()+5*60*1000;
   while(Date.now()<deadline){
     await new Promise(r=>setTimeout(r,2000));
     const s=await square({action:'status',id}),st=String(s.request?.status||'');
     if(st==='approved'){ $('payMsg').textContent='Square approved. Recording payment…'; await markBalancePaidAndCollect(); return }
     if(['failed','cancelled','expired'].includes(st))throw Error(s.request?.error_message||('Square payment '+st+'.'));
     $('payMsg').textContent='Waiting for Square approval…';
   }
   throw Error('Square payment timed out. The roast has not been marked paid or collected.');
 }catch(e){$('payMsg').className='status badtext';$('payMsg').textContent=e.message}
}
$('loadBtn').onclick=load;$('refreshBtn').onclick=load;$('date').onchange=load;$('cancelPay').onclick=closePay;$('cashPay').onclick=cashPayment;$('cardPay').onclick=cardPayment;$('closeBtn').onclick=()=>{if(history.length>1)history.back();else location.href='./pos.html'};
load();
})();
</script>
</body></html>
