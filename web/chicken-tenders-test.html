<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Chicken Tenders Test</title><style>body{font-family:system-ui;margin:0;background:#08101d;color:#fff}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#132038;border-radius:18px;padding:16px;margin:12px 0}.cat{border:1px solid #2b4161;border-radius:16px;overflow:hidden;margin:12px 0;background:#0d1829}.head{width:100%;border:0;background:#162641;color:#fff;padding:15px;text-align:left;font-weight:900;font-size:18px;display:flex;justify-content:space-between}.body{display:none;padding:14px}.cat.open .body{display:block}.item{padding:14px 0;border-bottom:1px solid #ffffff18}.item:last-child{border-bottom:0}.name{font-weight:900;font-size:17px}.desc{opacity:.8;font-size:13px;line-height:1.45;margin:5px 0}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:900;background:#ffd43b;color:#08101d}.select{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border-radius:10px;border:1px solid #324866;background:#0d1829;color:#fff}.mod{margin-top:10px;padding:12px;border-radius:12px;background:#0b1423}.mod label{display:block;margin:6px 0}.danger{border:1px solid #b91c1c;background:#2b0b0b}.warning{color:#ff8a80}.tiny{font-size:12px;opacity:.72}.summary{white-space:pre-wrap;line-height:1.5;background:#0b1423;border-radius:12px;padding:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#7f1d1d;font-size:12px;font-weight:900}</style></head><body><div class="wrap"><h1>Dexter's Chicken Tenders — TEST</h1><p class="tiny">Test build only. Live ordering/KDS/printing is unchanged.</p><div class="cat open"><button class="head"><span>🍗 Chicken Tenders</span><span>▾</span></button><div class="body" id="normal"></div></div><div class="cat danger"><button class="head"><span>🔥 Inferno Chicken Tenders</span><span>▾</span></button><div class="body" id="inferno"></div></div><div class="card"><h2>KDS / print payload preview</h2><div id="summary" class="summary">Nothing selected yet.</div><button class="btn" id="clear">Clear selection</button></div></div><script>const dips=["Dexter's Sauce","Nero Sauce","Luna Sauce","Inferno Sauce","Garlic Mayo","Fire Sauce","BBQ Sauce","Chilli Dip","Nashville Hot Honey","Spicy Chipotle","Ranch","Sweet Chilli"];const normal=[["Dexter's Chicken Tenders","Crispy buttermilk chicken tenders tossed in your choice of sauce or seasoning."],["Dexter's Crunch Tenders","Traditional chicken tenders in a crispy coating."],["Dexter's Garlic & Parmesan Tenders","Chicken tenders tossed in garlic butter, sprinkled with Parmesan cheese and finished with parsley."],["Dexter's BBQ Tenders","Chicken tenders tossed in smoky sweet BBQ sauce and finished with parsley."],["Dexter's Fire Tenders","Chicken tenders tossed in fiery sauce and finished with chilli flakes."],["Dexter's Nashville Tenders","Chicken tenders tossed in smoky Nashville BBQ sauce."]];const normalPortions=[{label:'4 tenders + 1 dip',price:8.5,dips:1},{label:'6 tenders + 2 dips',price:10.5,dips:2},{label:'10 tenders + 3 dips',price:16.5,dips:3}],inferno=[["Dexter's Inferno Chicken","Chicken tenders tossed in homemade spicy Inferno sauce, topped with jalapeño and chilli, then dusted with cayenne pepper. EXTREMELY HOT."]],infernoPortions=[{label:'4 tenders + 1 dip',price:9,dips:1},{label:'6 tenders + 2 dips',price:11,dips:2},{label:'10 tenders + 3 dips',price:17,dips:3}];document.querySelectorAll('.head').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));const money=n=>'£'+Number(n).toFixed(2),portionSet=t=>t==='inferno'?infernoPortions:normalPortions,category=t=>t==='inferno'?'Inferno Chicken Tenders':'Chicken Tenders';function dipSelects(n,id){let h='';for(let x=1;x<=n;x++)h+=`<label>Included dip ${x}<select class="select dip" data-id="${id}"><option value="">Choose dip ${x}</option>${dips.map(d=>`<option>${d}</option>`).join('')}</select></label>`;return h}function itemHtml(type,arr,portions){return arr.map((it,i)=>{const id=type+'-'+i;return `<div class="item"><div class="name">${it[0]}</div><div class="desc">Ingredients: ${it[1]}</div><div class="mod"><label>Portion / included dips<select class="select portion" data-id="${id}" data-type="${type}"><option value="">Choose portion</option>${portions.map((p,j)=>`<option value="${j}">${p.label} — ${money(p.price)}</option>`).join('')}</select></label><div id="dips-${id}"></div><label>Extra dips — 80p each<select class="select extras" data-id="${id}"><option value="0">No extra dips</option><option value="1">1 extra dip (+£0.80)</option><option value="2">2 extra dips (+£1.60)</option><option value="3">3 extra dips (+£2.40)</option></select></label><div id="extra-${id}"></div><button class="btn add" data-id="${id}" data-type="${type}" data-name="${it[0]}">Preview KDS ticket</button></div></div>`}).join('')}normalEl=document.getElementById('normal');infernoEl=document.getElementById('inferno');normalEl.innerHTML=itemHtml('normal',normal,normalPortions);infernoEl.innerHTML='<div class="pill">EXTREMELY HOT</div>'+itemHtml('inferno',inferno,infernoPortions);document.querySelectorAll('.portion').forEach(s=>s.onchange=()=>{const box=document.getElementById('dips-'+s.dataset.id);box.innerHTML=s.value===''?'':dipSelects(portionSet(s.dataset.type)[+s.value].dips,s.dataset.id)});document.querySelectorAll('.extras').forEach(s=>s.onchange=()=>{const box=document.getElementById('extra-'+s.dataset.id);box.innerHTML='';for(let x=1;x<=+s.value;x++)box.innerHTML+=`<label>Extra dip ${x}<select class="select extra-dip" data-id="${s.dataset.id}"><option value="">Choose extra dip ${x}</option>${dips.map(d=>`<option>${d}</option>`).join('')}</select></label>`});document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{const id=b.dataset.id,type=b.dataset.type,pSel=document.querySelector(`.portion[data-id="${id}"]`);if(!pSel||pSel.value==='')return alert('Choose a portion first.');const p=portionSet(type)[+pSel.value],chosen=[...document.querySelectorAll(`.dip[data-id="${id}"]`)].map(x=>x.value);if(chosen.length!==p.dips||chosen.some(x=>!x))return alert('Choose all included dips.');const exSel=document.querySelector(`.extras[data-id="${id}"]`),exN=+(exSel?.value||0),extra=[...document.querySelectorAll(`.extra-dip[data-id="${id}"]`)].map(x=>x.value);if(exN&&extra.some(x=>!x))return alert('Choose all extra dips.');const payload={category:category(type),item:b.dataset.name,portion:p.label,included_dips:chosen,extra_dips:extra,total:p.price+exN*.8};document.getElementById('summary').textContent=`CATEGORY: ${payload.category}\nITEM: ${payload.item}\nPORTION: ${payload.portion}\nINCLUDED DIPS: ${payload.included_dips.join(', ')}${payload.extra_dips.length?'\nEXTRA DIPS: '+payload.extra_dips.join(', '):''}\nTOTAL: ${money(payload.total)}`});document.getElementById('clear').onclick=()=>document.getElementById('summary').textContent='Nothing selected yet.';</script></body></html>
