<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's KDS Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#050a12;color:#fff}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#111d31;border:1px solid #263a5e;border-radius:18px;padding:16px;margin:12px 0}.btn{padding:12px 14px;border:0;border-radius:12px;font-weight:900;margin:6px;background:#ffd43b}.btn.red{background:#7a2634;color:#fff}.btn.blue{background:#223454;color:#fff}.input{padding:11px;border-radius:10px;border:1px solid #324866;background:#0d1829;color:#fff}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:999px;font-weight:900}.open{background:#19452f;color:#a8f4ca}.closed{background:#4a2028;color:#ffd5d5}.new{border:2px solid #ffd43b;box-shadow:0 0 25px #ffd43b33}.items{font-size:18px;line-height:1.5}.bad{color:#ffc1cb}.ok{color:#9ff3c5}.contact{margin-top:5px;font-weight:800}</style></head><body><div class="wrap"><div class="top"><h1>Dexter's KDS Collection Test</h1><div><span id="switchState" class="pill closed">Checking…</span></div></div><div class="card"><h2>Collection ordering control</h2><p>Admin must manually open collection ordering. If you shut early, switch it off and customers cannot place new orders.</p><button id="openBtn" class="btn">OPEN collection orders</button><button id="closeBtn" class="btn red">CLOSE collection orders</button><button id="alertsBtn" class="btn blue">Enable spoken order alerts</button><div id="controlMsg"></div></div><div id="orders"><div class="card">Waiting for orders…</div></div></div><script>const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';const sb=supabase.createClient(U,K);const $=i=>document.getElementById(i);let alerts=false,pendingIds='',speakTimer=null,reasons=[];async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||''}async function api(body){const t=await tok();if(!t)throw Error('Please sign in with a Staff/Admin account on this device first.');const r=await fetch(U+'/functions/v1/collection-orders-test-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function setEnabled(v){try{const d=await api({action:'set_enabled',enabled:v});$('controlMsg').innerHTML='<p class="ok">Collection ordering '+(d.enabled?'opened':'closed')+'.</p>';load()}catch(e){$('controlMsg').innerHTML='<p class="bad">'+e.message+'</p>'}}function speakNow(){if(!alerts)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('You have a new order');u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}catch{}}function syncAlarm(hasPending){if(hasPending&&alerts&&!speakTimer){speakNow();speakTimer=setInterval(speakNow,5000)}if(!hasPending&&speakTimer){clearInterval(speakTimer);speakTimer=null;try{speechSynthesis.cancel()}catch{}}}async function act(id,action,reason){try{await api({action,id,reason});load()}catch(e){alert(e.message)}}async function load(){try{const s=await api({action:'status'});reasons=s.rejection_reasons||[];$('switchState').textContent=s.enabled?'COLLECTION OPEN':'COLLECTION CLOSED';$('switchState').className='pill '+(s.enabled?'open':'closed');const d=await api({action:'kds_orders'});const arr=d.orders||[];const pending=arr.filter(o=>o.status==='pending');const ids=pending.map(o=>o.id).join(',');if(ids!==pendingIds&&pending.length){pendingIds=ids;speakNow()}if(!pending.length)pendingIds='';syncAlarm(pending.length>0);$('orders').innerHTML=arr.length?arr.map(o=>`<div class="card ${o.status==='pending'?'new':''}"><div class="top"><div><h2 style="margin:0">Order #${o.order_number} ${o.status==='pending'?'🛎️ NEW':''}</h2><div>${o.customer_name||'Customer'} · Collection ${o.collection_time}</div><div class="contact">📞 ${o.customer_phone||'No phone number'}</div></div><span class="pill ${o.status==='pending'?'closed':'open'}">${o.status.toUpperCase()}</span></div><div class="items">${(o.items||[]).map(i=>`${i.qty} × ${i.name}`).join('<br>')}</div>${o.order_notes?`<p><b>Notes:</b> ${o.order_notes}</p>`:''}${o.status==='pending'?`<div><button class="btn" onclick="act('${o.id}','accept')">ACCEPT ORDER</button><select id="r${o.id}" class="input">${reasons.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn red" onclick="act('${o.id}','reject',document.getElementById('r${o.id}').value)">REJECT ORDER</button></div>`:`<div><button class="btn blue" onclick="act('${o.id}','preparing')">Preparing</button><button class="btn" onclick="act('${o.id}','ready')">Ready for collection</button>${o.status==='ready'?`<button class="btn blue" onclick="act('${o.id}','collected')">Collected</button>`:''}</div>`}</div>`).join(''):'<div class="card">No active test collection orders.</div>'}catch(e){$('orders').innerHTML='<div class="card bad">'+e.message+'</div>'}}$('openBtn').onclick=()=>setEnabled(true);$('closeBtn').onclick=()=>setEnabled(false);$('alertsBtn').onclick=()=>{alerts=!alerts;$('alertsBtn').textContent=alerts?'Spoken alerts ON':'Enable spoken order alerts';if(alerts)speakNow();else syncAlarm(false)};load();setInterval(load,2000);</script></body></html>
