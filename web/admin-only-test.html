<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Admin Only Test</title><style>html,body{margin:0;height:100%;background:#08101d;color:#fff;font-family:system-ui}.bar{padding:10px 12px;background:#111827;border-bottom:1px solid #334155;display:flex;gap:10px;align-items:center;justify-content:space-between}.bar b{color:#ffd43b}.bar button{border:0;border-radius:10px;padding:9px 12px;font-weight:900;background:#ffd43b;color:#111827}.deals-control{margin:10px 12px;padding:14px;background:#132038;border:1px solid #ffffff18;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:14px}.deals-control small{display:block;color:#b8c4d6;margin-top:4px}.switch{position:relative;width:58px;height:32px;flex:none}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#3a4658;border-radius:999px;cursor:pointer}.slider:before{content:"";position:absolute;width:24px;height:24px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked + .slider{background:#22c55e}.switch input:checked + .slider:before{transform:translateX(26px)}#dealStatus{font-weight:900;color:#9ff3c5}#dealStatus.off{color:#ffb4b4}iframe{display:block;width:100%;height:calc(100% - 142px);border:0;background:#08101d}</style></head><body><div class="bar"><div><b>ADMIN-ONLY TEST</b><div style="font-size:12px;opacity:.75">This does not change the live customer app.</div></div><button id="reload">Reload test</button></div><div class="deals-control"><div><b>Dexter's Deals — Automatic Deals</b><span id="dealStatus">ON — monthly deals active</span><small>Manual staff override. OFF pauses automatic customer deals; ON resumes them.</small></div><label class="switch"><input id="dealToggle" type="checkbox" checked><span class="slider"></span></label></div><iframe id="app" src="/"></iframe><script>const KEY='dexters_test_auto_deals';const toggle=document.getElementById('dealToggle'),status=document.getElementById('dealStatus');function syncDealControl(){const on=localStorage.getItem(KEY)!=='off';toggle.checked=on;status.textContent=on?'ON — monthly deals active':'OFF — automatic deals paused';status.classList.toggle('off',!on)}toggle.onchange=()=>{localStorage.setItem(KEY,toggle.checked?'on':'off');syncDealControl();window.dispatchEvent(new StorageEvent('storage',{key:KEY,newValue:toggle.checked?'on':'off'}))};syncDealControl();const f=document.getElementById('app');document.getElementById('reload').onclick=()=>f.contentWindow.location.reload();function apply(){let d;try{d=f.contentDocument}catch{return}if(!d)return;const pages=[...d.querySelectorAll('[id$="Page"]')];const allowed=new Set(['loginPage','staffPage','adminPage']);pages.forEach(p=>{if(allowed.has(p.id))return;p.style.setProperty('display','none','important')});const navs=[...d.querySelectorAll('nav,footer,.bottom-nav,.nav,.tabs,.tabbar')];navs.forEach(n=>{[...n.querySelectorAll('button,a')].forEach(x=>{const t=(x.textContent||'').toLowerCase();if(!/admin|staff|logout|sign out/.test(t))x.style.setProperty('display','none','important')})});const staff=d.getElementById('staffPage')||d.getElementById('adminPage');const login=d.getElementById('loginPage');if(staff){const cs=getComputedStyle(staff);if(cs.display!=='none'){pages.forEach(p=>{if(p!==staff&&p!==login)p.style.setProperty('display','none','important')})}}}f.onload=()=>{apply();try{new MutationObserver(apply).observe(f.contentDocument.body,{attributes:true,childList:true,subtree:true,attributeFilter:['class','style']})}catch{};setInterval(apply,500)};</script></body></html>
