<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Collection Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#08101d;color:#fff}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#132038;border-radius:18px;padding:16px;margin:12px 0}.btn{width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;margin:6px 0;background:#ffd43b}.input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #324866;background:#0d1829;color:#fff}.ok{color:#9ff3c5}.bad{color:#ffc1cb}.status{padding:12px;border-radius:12px;background:#0d1829;margin:8px 0}.menu-cat{background:#0d1829;border:1px solid #2b4161;border-radius:15px;margin:10px 0;overflow:hidden}.menu-head{width:100%;border:0;background:#162641;color:#fff;padding:14px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:17px;font-weight:900}.menu-head span:last-child{color:#ffd43b;font-size:20px}.menu-body{display:none;padding:0 14px}.menu-cat.open .menu-body{display:block}.menu-cat.open .menu-head span:last-child{transform:rotate(180deg)}.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff18}.item:last-child{border-bottom:0}.item-main{flex:1}.item-name{font-weight:900}.item-desc{opacity:.68;font-size:12px;line-height:1.35;margin-top:3px}.item-price{font-weight:900;color:#ffd43b;margin-top:3px}.menu-empty{padding:14px;color:#aab4c3}.section-title{display:flex;justify-content:space-between;gap:8px;align-items:center}.tiny{font-size:12px;color:#aab4c3}.qty-wrap{display:flex;align-items:center;justify-content:flex-end;min-width:118px}.add-btn,.qty-btn{border:0;border-radius:10px;font-weight:900;cursor:pointer}.add-btn{background:#ffd43b;color:#111;padding:10px 14px}.qty-stepper{display:flex;align-items:center;gap:8px;background:#162641;border-radius:12px;padding:5px}.qty-btn{width:34px;height:34px;background:#ffd43b;color:#111;font-size:21px;line-height:1}.qty-num{min-width:22px;text-align:center;font-weight:900;font-size:16px}@media(max-width:520px){.item{align-items:flex-start}.qty-wrap{min-width:108px}.add-btn{padding:9px 12px}}</style></head><body><div class="wrap"><h1>Dexter's Collection Ordering Test</h1><div class="card"><div id="availability">Checking collection ordering…</div><button class="btn" id="notifyBtn">Enable order notifications</button></div><div class="card"><div class="section-title"><div><h2 style="margin-bottom:4px">Build your collection order</h2><div class="tiny">Tap a menu category to open it.</div></div></div><input id="search" class="input" placeholder="Search menu or ingredients"><div id="menu">Loading menu…</div><label>Collection time</label><select id="collectionTime" class="input"><option>ASAP</option><option>15 minutes</option><option>30 minutes</option><option>45 minutes</option><option>60 minutes</option></select><textarea id="notes" class="input" rows="3" placeholder="Order notes"></textarea><button id="placeBtn" class="btn">Place test collection order</button><div id="msg"></div></div><div class="card"><h2>My test orders</h2><div id="orders">No test orders yet.</div></div></div><script>const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';const sb=supabase.createClient(U,K);let categories=[],cart={},last={};const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function keyFor(name){return btoa(unescape(encodeURIComponent(name))).replace(/=/g,'')}async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||''}async function api(body){const t=await tok();if(!t)throw Error('Please open this page after signing into the Dexter’s Loyalty app.');const r=await fetch(U+'/functions/v1/collection-orders-test-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function status(){try{const d=await api({action:'status'});$('availability').innerHTML=d.enabled?'<b class="ok">Collection ordering is OPEN</b>':'<b class="bad">Collection ordering is CLOSED by the restaurant</b>';$('placeBtn').disabled=!d.enabled}catch(e){$('availability').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}async function loadMenu(){try{const r=await fetch(U+'/rest/v1/rpc/loyalty_menu_public',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}'});const d=await r.json();categories=Array.isArray(d)?d:[];renderMenu()}catch{$('menu').textContent='Could not load menu.'}}function qtyHtml(k){const q=Number(cart[k]||0);return q>0?`<div class="qty-stepper"><button class="qty-btn" type="button" data-minus="${k}">−</button><span class="qty-num">${q}</span><button class="qty-btn" type="button" data-plus="${k}">+</button></div>`:`<button class="add-btn" type="button" data-add="${k}">ADD</button>`}function renderMenu(){const q=($('search').value||'').toLowerCase().trim();let html='';for(const c of categories){const items=(c.items||[]).filter(i=>!q||(`${c.name} ${i.name} ${i.description||''}`).toLowerCase().includes(q));if(!items.length)continue;html+=`<div class="menu-cat ${q?'open':''}"><button class="menu-head" type="button"><span>${esc(c.name)} <small class="tiny">(${items.length})</small></span><span>▾</span></button><div class="menu-body">${items.map(i=>{const k=keyFor(i.name);return `<div class="item"><div class="item-main"><div class="item-name">${esc(i.name)}</div>${i.description?`<div class="item-desc">${esc(i.description)}</div>`:''}<div class="item-price">${esc(i.price||'')}</div></div><div class="qty-wrap" data-qty-wrap="${k}">${qtyHtml(k)}</div></div>`}).join('')}</div></div>`}$('menu').innerHTML=html||'<div class="menu-empty">No menu items match your search.</div>';document.querySelectorAll('.menu-head').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>changeQty(b.dataset.add,1));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1))}function changeQty(k,delta){cart[k]=Math.max(0,Math.min(20,Number(cart[k]||0)+delta));const wrap=document.querySelector('[data-qty-wrap="'+CSS.escape(k)+'"]');if(wrap){wrap.innerHTML=qtyHtml(k);const a=wrap.querySelector('[data-add]'),p=wrap.querySelector('[data-plus]'),m=wrap.querySelector('[data-minus]');if(a)a.onclick=()=>changeQty(k,1);if(p)p.onclick=()=>changeQty(k,1);if(m)m.onclick=()=>changeQty(k,-1)}}async function place(){const items=[];for(const c of categories)for(const i of(c.items||[])){const k=keyFor(i.name),q=Number(cart[k]||0);if(q>0)items.push({name:i.name,price:i.price||'',qty:q})}try{const d=await api({action:'create',items,collection_time:$('collectionTime').value,order_notes:$('notes').value});$('msg').innerHTML='<div class="status ok">Order #'+d.order.order_number+' sent to the KDS. Waiting for the restaurant to accept or reject it.</div>';cart={};renderMenu();loadOrders()}catch(e){$('msg').innerHTML='<div class="status bad">'+esc(e.message)+'</div>'}}function notify(title,body){if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body})}async function loadOrders(){try{const d=await api({action:'my_orders'});$('orders').innerHTML=(d.orders||[]).map(o=>{const prev=last[o.id];if(prev&&prev!==o.status){const body=o.status==='rejected'?'Order rejected: '+(o.rejection_reason||'No reason given'):'Order status: '+o.status;notify("Dexter's order #"+o.order_number,body)}last[o.id]=o.status;return `<div class="status"><b>Order #${o.order_number}</b><br>Status: <b>${esc(o.status.toUpperCase())}</b>${o.rejection_reason?'<br>Reason: '+esc(o.rejection_reason):''}<br><small>Collection: ${esc(o.collection_time)}</small></div>`}).join('')||'No test orders yet.'}catch(e){$('orders').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}$('search').oninput=renderMenu;$('placeBtn').onclick=place;$('notifyBtn').onclick=async()=>{if('Notification'in window){const p=await Notification.requestPermission();$('notifyBtn').textContent=p==='granted'?'Notifications enabled':'Notifications not enabled'}else $('notifyBtn').textContent='Use the on-screen order updates'};loadMenu();status();loadOrders();setInterval(()=>{status();loadOrders()},2500);</script></body></html>
