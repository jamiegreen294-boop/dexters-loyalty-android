<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Collection Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#08101d;color:#fff}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#132038;border-radius:18px;padding:16px;margin:12px 0}.btn{width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;margin:6px 0;background:#ffd43b}.input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #324866;background:#0d1829;color:#fff}.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff18}.item input{width:70px}.ok{color:#9ff3c5}.bad{color:#ffc1cb}.status{padding:12px;border-radius:12px;background:#0d1829;margin:8px 0}.hidden{display:none}</style></head><body><div class="wrap"><h1>Dexter's Collection Ordering Test</h1><div class="card"><div id="availability">Checking collection ordering…</div><button class="btn" id="notifyBtn">Enable order notifications</button></div><div class="card"><h2>Build your collection order</h2><input id="search" class="input" placeholder="Search menu"><div id="menu">Loading menu…</div><label>Collection time</label><select id="collectionTime" class="input"><option>ASAP</option><option>15 minutes</option><option>30 minutes</option><option>45 minutes</option><option>60 minutes</option></select><textarea id="notes" class="input" rows="3" placeholder="Order notes"></textarea><button id="placeBtn" class="btn">Place test collection order</button><div id="msg"></div></div><div class="card"><h2>My test orders</h2><div id="orders">No test orders yet.</div></div></div><script>const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';const sb=supabase.createClient(U,K);let menu=[],cart={},last={};const $=id=>document.getElementById(id);async function tok(){const {data}=await sb.auth.getSession();return data.session?.access_token||''}async function api(body){const t=await tok();if(!t)throw Error('Please open this page after signing into the Dexter’s Loyalty app.');const r=await fetch(U+'/functions/v1/collection-orders-test-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function status(){try{const d=await api({action:'status'});$('availability').innerHTML=d.enabled?'<b class="ok">Collection ordering is OPEN</b>':'<b class="bad">Collection ordering is CLOSED by the restaurant</b>';$('placeBtn').disabled=!d.enabled}catch(e){$('availability').innerHTML='<span class="bad">'+e.message+'</span>'}}async function loadMenu(){try{const r=await fetch(U+'/rest/v1/rpc/loyalty_menu_public',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}'});const d=await r.json();menu=(d||[]).flatMap(c=>(c.items||[]).map(i=>({name:i.name,price:i.price,cat:c.name})));renderMenu()}catch{$('menu').textContent='Could not load menu.'}}function renderMenu(){const q=$('search').value.toLowerCase();$('menu').innerHTML=menu.filter(x=>!q||(x.name+' '+x.cat).toLowerCase().includes(q)).slice(0,100).map((x,i)=>{const key=btoa(unescape(encodeURIComponent(x.name))).replace(/=/g,'');return `<div class="item"><div style="flex:1"><b>${x.name}</b><div style="opacity:.7;font-size:12px">${x.cat} · ${x.price||''}</div></div><input class="input" type="number" min="0" max="20" value="${cart[key]||0}" data-k="${key}" data-name="${encodeURIComponent(x.name)}" data-price="${encodeURIComponent(x.price||'')}"></div>`}).join('');document.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{cart[el.dataset.k]=Math.max(0,Number(el.value)||0)})}async function place(){const items=[];document.querySelectorAll('[data-k]').forEach(el=>{const q=Number(cart[el.dataset.k]||0);if(q>0)items.push({name:decodeURIComponent(el.dataset.name),price:decodeURIComponent(el.dataset.price),qty:q})});try{const d=await api({action:'create',items,collection_time:$('collectionTime').value,order_notes:$('notes').value});$('msg').innerHTML='<div class="status ok">Order #'+d.order.order_number+' sent to the KDS. Waiting for the restaurant to accept or reject it.</div>';cart={};renderMenu();loadOrders()}catch(e){$('msg').innerHTML='<div class="status bad">'+e.message+'</div>'}}function notify(title,body){if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body})}async function loadOrders(){try{const d=await api({action:'my_orders'});$('orders').innerHTML=(d.orders||[]).map(o=>{const prev=last[o.id];if(prev&&prev!==o.status){const body=o.status==='rejected'?'Order rejected: '+(o.rejection_reason||'No reason given'):'Order status: '+o.status;notify("Dexter's order #"+o.order_number,body)}last[o.id]=o.status;return `<div class="status"><b>Order #${o.order_number}</b><br>Status: <b>${o.status.toUpperCase()}</b>${o.rejection_reason?'<br>Reason: '+o.rejection_reason:''}<br><small>Collection: ${o.collection_time}</small></div>`}).join('')||'No test orders yet.'}catch(e){$('orders').innerHTML='<span class="bad">'+e.message+'</span>'}}$('search').oninput=renderMenu;$('placeBtn').onclick=place;$('notifyBtn').onclick=async()=>{if('Notification'in window){const p=await Notification.requestPermission();$('notifyBtn').textContent=p==='granted'?'Notifications enabled':'Notifications not enabled'}else $('notifyBtn').textContent='Use the on-screen order updates'};loadMenu();status();loadOrders();setInterval(()=>{status();loadOrders()},2500);</script></body></html>
