<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dexter's Deals — Test Preview</title>
<style>
:root{--bg:#07111f;--panel:#132038;--panel2:#0e1a2d;--text:#fff;--muted:#b8c4d6;--gold:#ffd43b;--green:#9ff3c5;--red:#ff8d9e;--line:#ffffff18}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#182947 0,#07111f 48%);color:var(--text);min-height:100vh}.wrap{max-width:820px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;background:#ff315f;color:#fff;font-size:12px;font-weight:900;border-radius:999px;padding:7px 10px;letter-spacing:.04em}.top h1{font-size:34px;line-height:1;margin:10px 0 8px}.sub{color:var(--muted);margin:0}.notice{margin:16px 0;padding:12px 14px;background:#10223a;border:1px solid #4f77a8;border-radius:14px;font-size:13px;color:#dbeafe}.month-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:16px 0}.month-card label{font-size:12px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}.month-row{display:flex;gap:10px;align-items:center;margin-top:8px}.month-row select{flex:1;background:#081422;color:#fff;border:1px solid #ffffff30;border-radius:12px;padding:12px;font-weight:800;font-size:16px}.auto-pill{white-space:nowrap;background:#123529;color:#adf4cf;border:1px solid #2f7659;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:900}.hero{background:linear-gradient(135deg,#4f1630,#151f36 60%,#5a3d09);border:1px solid #ffffff20;border-radius:22px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:18px;top:8px;font-size:80px;opacity:.12}.eyebrow{font-size:12px;font-weight:900;color:#ffe58d;letter-spacing:.12em;text-transform:uppercase}.hero h2{font-size:30px;margin:6px 0 8px}.hero p{margin:0;color:#e5e7eb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.deal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;min-height:230px;box-shadow:0 10px 28px #00000025}.deal .tag{font-size:11px;font-weight:900;color:#08101d;background:var(--gold);display:inline-block;padding:5px 8px;border-radius:999px;align-self:flex-start}.deal h3{margin:12px 0 7px;font-size:20px}.deal p{margin:0 0 10px;color:var(--muted);line-height:1.4}.price{margin-top:auto;display:flex;align-items:end;gap:9px}.old{text-decoration:line-through;color:#8794a7;font-size:14px}.new{font-size:26px;font-weight:950;color:var(--green)}.save{font-size:12px;color:#ffdda0;font-weight:800;margin:2px 0 10px}.order{border:0;border-radius:12px;background:var(--gold);color:#08101d;font-weight:950;padding:12px;cursor:pointer}.order:active{transform:scale(.99)}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#07111f;border:1px solid #ffffff30;border-radius:14px;padding:11px 14px;box-shadow:0 10px 35px #0008;display:none;z-index:9;max-width:90%;text-align:center}.footer{margin-top:18px;color:#8491a6;font-size:12px;text-align:center}@media(max-width:620px){.grid{grid-template-columns:1fr}.top h1{font-size:30px}.month-row{align-items:stretch;flex-direction:column}.auto-pill{align-self:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><span class="badge">TEST PREVIEW ONLY</span><h1>Dexter's Deals</h1><p class="sub">Fresh deals that rotate automatically through the year.</p></div><div style="font-size:32px">🔥</div></div>
  <div class="notice">This page is isolated from the live ordering system. The buttons below are demos and do not place orders or change live prices.</div>
  <div class="month-card"><label for="month">Preview automatic month</label><div class="month-row"><select id="month"></select><span class="auto-pill">AUTO • 1st of each month</span></div></div>
  <section id="hero" class="hero"></section>
  <main id="deals" class="grid"></main>
  <div class="footer">Dexter's Deals test • Monthly rotation preview</div>
</div>
<div id="status" class="status"></div>
<script>
const data={
0:{title:'January Warm-Up Deals',line:'Start the year with comfort-food savings.',icon:'❄️',deals:[['Winter Warmer','Hot meal + can of juice','£10.85','£8.95'],['Burger Boost','Selected burger + fries','£11.50','£9.95'],['Tenders Treat','4 chicken tenders + dip + fries','£11.50','£9.99']]},
1:{title:"Valentine's Deals",line:'A wee treat for you — or share it if you must. ❤️',icon:'❤️',deals:[['Two Can Dine','2 selected mains + 2 cans','£21.70','£18.95'],['Sweetheart Waffle','Selected waffle + hot drink','£9.50','£7.95'],['Love at First Bite','2 Street Subs + fries to share','£18.00','£15.95']]},
2:{title:'March Munch Deals',line:'Big flavour, better value.',icon:'🍀',deals:[['Street Sub Combo','Selected Street Sub + fries + can','£10.85','£9.49'],['Loaded Lunch','Loaded fries + can','£9.85','£8.49'],['Tenders Tuesday','6 tenders + 2 dips','£10.50','£9.49']]},
3:{title:'Easter Deals',line:'Crack into something better than an egg.',icon:'🐣',deals:[['Easter Feast','2 burgers + 2 fries + 2 cans','£26.00','£21.95'],['Kids Treat Deal','Kids meal + small sweet treat','£8.50','£6.95'],['Spring Tenders','6 tenders + 2 dips + can','£11.85','£10.49']]},
4:{title:'May Deals',line:'Bank holiday fuel, Dexter’s style.',icon:'☀️',deals:[['Bank Holiday Box','Selected burger + tenders + fries','£17.50','£14.95'],['Lunch Saver','Selected roll + can','£6.85','£5.95'],['Waffle & Shake','Selected waffle + milkshake','£12.00','£9.95']]},
5:{title:'Summer Kick-Off',line:'Longer days. Better deals.',icon:'🌤️',deals:[['Summer Sub','Selected Street Sub + can','£8.85','£7.49'],['Tenders & Shake','4 tenders + dip + milkshake','£13.00','£11.49'],['Loaded Summer','Loaded fries + can','£9.85','£8.49']]},
6:{title:'July Summer Deals',line:'Holiday hunger sorted.',icon:'☀️',deals:[['Family Summer Deal','2 mains + 2 kids meals + 4 cans','£39.00','£32.95'],['Cool Down Combo','Selected meal + milkshake','£14.50','£12.49'],['Tenders Night','10 tenders + 3 dips','£16.50','£14.95']]},
7:{title:'August Deals',line:'Last bit of summer. Make it tasty.',icon:'🍔',deals:[['Burger & Fries','Selected burger + fries','£11.50','£9.95'],['Sub & Shake','Selected Street Sub + milkshake','£13.50','£11.49'],['Tenders Share Box','10 tenders + 3 dips + 2 cans','£19.20','£16.95']]},
8:{title:'September Deals',line:'Back-to-routine deals without boring food.',icon:'🔥',deals:[['Midweek Munch','Selected main + fries + can','£12.85','£10.95'],['Tenders Deal','6 tenders + 2 dips + can','£11.85','£10.49'],['Street Sub Saver','Selected Street Sub + fries','£9.50','£8.49'],['Waffle Wednesday','Selected waffle + hot drink','£9.50','£7.95']]},
9:{title:'Halloween Deals',line:'Scary good deals all October. 🎃',icon:'🎃',deals:[['Monster Meal','Selected burger + loaded fries + can','£16.85','£13.95'],['Inferno Challenge','4 Inferno tenders + 1 dip + fries','£12.00','£10.95'],['Trick or Treat Waffle','Selected waffle + milkshake','£12.00','£9.95'],['Beast Night','Selected Beast Box + can','£16.30','£14.95']]},
10:{title:'November Deals',line:'Cold outside. Dexter’s inside.',icon:'🍟',deals:[['Winter Box','Selected burger + tenders + fries','£17.50','£14.95'],['Soup & Roll','Soup + filled roll','£8.00','£6.95'],['Friday Feast','2 selected mains + 2 cans','£21.70','£18.95']]},
11:{title:'Christmas Deals',line:'Festive fuel without the faff. 🎄',icon:'🎄',deals:[['Christmas Feast','2 mains + 2 fries + 2 cans','£26.00','£21.95'],['Festive Tenders','10 tenders + 3 dips + 2 cans','£19.20','£16.95'],['Santa’s Sweet Deal','Selected waffle + milkshake','£12.00','£9.95'],['Family Christmas Deal','2 mains + 2 kids meals + 4 cans','£39.00','£32.95']]}
};
const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
const select=document.getElementById('month');names.forEach((n,i)=>select.add(new Option(n,i)));select.value=new Date().getMonth();
function money(s){return Number(String(s).replace(/[^0-9.]/g,''))||0}
function render(){const m=data[Number(select.value)],hero=document.getElementById('hero');hero.innerHTML=`<div class="eyebrow">${m.icon} Monthly featured deals</div><h2>${m.title}</h2><p>${m.line}</p>`;document.getElementById('deals').innerHTML=m.deals.map((d,i)=>{const save=Math.max(0,money(d[2])-money(d[3])).toFixed(2);return `<article class="deal"><span class="tag">DEAL ${i+1}</span><h3>${d[0]}</h3><p>${d[1]}</p><div class="price"><span class="old">${d[2]}</span><span class="new">${d[3]}</span></div><div class="save">Save £${save}</div><button class="order" data-name="${d[0].replace(/"/g,'&quot;')}">ORDER DEAL</button></article>`}).join('');document.querySelectorAll('.order').forEach(b=>b.onclick=()=>toast(b.dataset.name+' — demo only. Nothing has been ordered.'))}
function toast(t){const s=document.getElementById('status');s.textContent=t;s.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>s.style.display='none',2600)}
select.onchange=render;render();
</script>
</body>
</html>
