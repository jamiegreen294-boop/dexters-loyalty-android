<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dexter's POS — Sunday Roast Test</title>
<style>
html,body{margin:0;height:100%;background:#07111f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#pos{position:fixed;inset:0;width:100%;height:100%;border:0}.sr-launch{position:fixed;top:9px;right:372px;z-index:50;border:0;border-radius:12px;padding:10px 14px;font-weight:1000;background:#ffd43b;color:#08101d;box-shadow:0 3px 14px #0008}.sr-backdrop{position:fixed;inset:0;z-index:80;background:#000b;display:grid;place-items:center;padding:14px}.hide{display:none}.sr-box{width:min(920px,96vw);max-height:92vh;overflow:auto;background:#10213a;color:#f7fbff;border:1px solid #31506f;border-radius:20px;padding:16px;box-shadow:0 12px 40px #000a}.sr-head{display:flex;gap:10px;align-items:center}.sr-head h2{margin:0;flex:1}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:900;background:#ffd43b;color:#08101d}.btn.secondary{background:#263c58;color:#fff}.btn.danger{background:#5a1420;color:#fff}.tabs{display:flex;gap:8px;margin:14px 0}.tabs .btn.on{background:#ffd43b;color:#08101d}.tabs .btn:not(.on){background:#162a45;color:#fff}.field{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #31506f;background:#09182a;color:#fff;margin:5px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}.qtyrow{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;background:#0b192b;border-radius:12px;padding:8px}.muted{color:#9eb0c5;font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.summary div{background:#0b192b;border-radius:12px;padding:10px;text-align:center}.summary b{display:block;font-size:20px}.message{min-height:22px;margin-top:10px}.bad{color:#ffadb8}.ok{color:#8ff0b3}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:1100px){.sr-launch{right:12px;top:60px}}@media(max-width:700px){.summary{grid-template-columns:1fr}.sr-launch{top:auto;bottom:14px;right:14px}}
</style>
</head>
<body>
<iframe id="pos" src="/pos-test.html" title="Dexter's POS"></iframe>
<button id="srLaunch" class="sr-launch">🍽 Sunday Roast</button>
<div id="srModal" class="sr-backdrop hide"><div class="sr-box">
 <div class="sr-head"><h2>Sunday Roast — POS</h2><button id="srClose" class="btn secondary">Close</button></div>
 <p class="muted">Create a new Sunday Roast order or amend an existing paid order. This uses the same live Sunday Roast stock and order database as the loyalty app.</p>
 <div class="tabs"><button id="newTab" class="btn on">New order</button><button id="editTab" class="btn">Edit order</button></div>
 <section id="newPane">
  <div class="grid"><label>Sunday date<input id="newDate" class="field" type="date"></label><label>Collection time<select id="newSlot" class="field"></select></label><label>Customer name<input id="newName" class="field" autocomplete="name"></label><label>Phone<input id="newPhone" class="field" inputmode="tel"></label></div>
  <h3>Dinners</h3><div id="newMeals" class="grid"></div><h3>Extras</h3><div id="newExtras" class="grid"></div>
  <div class="grid"><label>Payment<select id="newPayment" class="field"><option value="unpaid">Unpaid</option><option value="deposit_paid">Deposit / part paid</option><option value="paid_full">Paid in full</option></select></label><label>Amount already paid (£)<input id="newPaid" class="field" inputmode="decimal" value="0.00"></label></div>
  <div class="summary"><div><b id="newTotal">£0.00</b><span>Total</span></div><div><b id="newPaidShow">£0.00</b><span>Paid</span></div><div><b id="newBalance">£0.00</b><span>Balance due</span></div></div>
  <button id="createOrder" class="btn">Create Sunday Roast order</button><div id="newMsg" class="message"></div>
 </section>
 <section id="editPane" class="hide">
  <div class="grid"><label>Sunday date<input id="editDate" class="field" type="date"></label><label>Order<select id="editOrder" class="field"></select></label><label>Collection time<select id="editSlot" class="field"></select></label></div>
  <div id="editForm" class="hide"><h3>Dinners</h3><div id="editMeals" class="grid"></div><h3>Extras</h3><div id="editExtras" class="grid"></div>
  <div class="summary"><div><b id="editTotal">£0.00</b><span>New total</span></div><div><b id="editPaid">£0.00</b><span>Already paid</span></div><div><b id="editBalance">£0.00</b><span>Balance due</span></div></div>
  <button id="saveEdit" class="btn">Save order changes</button></div><div id="editMsg" class="message"></div>
 </section>
</div></div>
<script>
(()=>{'use strict';
const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';
const meals={chicken:{name:'Roast Chicken Dinner',p:1499},beef:{name:'Roast Beef Dinner',p:1499},mixed:{name:'Adult Mixed Roast Dinner',p:1499},kids_chicken:{name:'Kids’ Roast Chicken Dinner',p:999},kids_beef:{name:'Kids’ Roast Beef Dinner',p:999},kids_mixed:{name:'Kids Mixed Roast Dinner',p:999}};
const extras={yorkshire:{name:'Extra Yorkshire Pudding',p:75},gravy:{name:'Extra Gravy',p:100},stuffing:{name:'Extra Stuffing',p:100},roast_potatoes:{name:'Extra Roast Potatoes',p:150},chicken:{name:'Extra Chicken',p:250},beef:{name:'Extra Beef',p:350}};
const $=id=>document.getElementById(id),money=p=>'£'+(Number(p||0)/100).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let editOrders=[],editCurrent=null,editSettings=null;
function token(){try{const x=JSON.parse(localStorage.getItem('sb-bpnkouymdvcogeaqjmxl-auth-token')||'null');return x?.access_token||x?.currentSession?.access_token||x?.session?.access_token||''}catch{return''}}
async function api(action,body={}){const t=token();if(!t)throw Error('Sign in to the POS first, then try again.');const r=await fetch(U+'/functions/v1/sunday-roast-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({action,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Sunday Roast request failed');return d}
async function amend(id,body){const t=token();if(!t)throw Error('Sign in to the POS first, then try again.');const r=await fetch(U+'/functions/v1/sunday-roast-amend-api',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({id,...body})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Could not amend order');return d}
function empty(){return{meals:Object.fromEntries(Object.keys(meals).map(k=>[k,0])),extras:Object.fromEntries(Object.keys(extras).map(k=>[k,0]))}}
function rows(prefix,kind,cat){return Object.entries(cat).map(([k,x])=>`<label class="qtyrow"><span>${esc(x.name)}<br><small class="muted">${money(x.p)}</small></span><input class="field" style="margin:0" type="number" min="0" max="50" step="1" value="0" data-${prefix}-kind="${kind}" data-key="${k}"></label>`).join('')}
function read(prefix){const d=empty();document.querySelectorAll(`[data-${prefix}-kind]`).forEach(i=>d[i.getAttribute(`data-${prefix}-kind`)][i.dataset.key]=Math.max(0,Math.min(50,parseInt(i.value||'0',10)||0)));return d}
function total(d){let p=0;for(const [k,q] of Object.entries(d.meals))p+=(meals[k]?.p||0)*q;for(const [k,q] of Object.entries(d.extras))p+=(extras[k]?.p||0)*q;return p}
function hasMeal(d){return Object.values(d.meals).some(q=>q>0)}
function setRows(prefix,d){document.querySelectorAll(`[data-${prefix}-kind]`).forEach(i=>i.value=String(d[i.getAttribute(`data-${prefix}-kind`)]?.[i.dataset.key]||0))}
function settingsConfig(d){const s=d.settings||{};return{date:s.collection_date||'',slots:Array.isArray(s.slots)?s.slots:[]}}
async function loadNew(){try{$('newMsg').textContent='Loading…';const d=await api('status',$('newDate').value?{collection_date:$('newDate').value}:{}),c=settingsConfig(d);$('newDate').value=c.date;$('newSlot').innerHTML=c.slots.map(x=>`<option>${esc(x)}</option>`).join('');$('newMsg').textContent=''}catch(e){$('newMsg').textContent=e.message;$('newMsg').className='message bad'}}
function syncNew(){const d=read('new'),t=total(d);let paid=Math.max(0,Math.round((Number($('newPaid').value)||0)*100));if($('newPayment').value==='paid_full')paid=t;if($('newPayment').value==='unpaid')paid=0;paid=Math.min(t,paid);$('newPaid').value=(paid/100).toFixed(2);$('newTotal').textContent=money(t);$('newPaidShow').textContent=money(paid);$('newBalance').textContent=money(t-paid);return{d,t,paid}}
async function createOrder(){const b=$('createOrder');try{const x=syncNew();if(!hasMeal(x.d))throw Error('Choose at least one Sunday Roast dinner.');if(!$('newName').value.trim())throw Error('Enter the customer name.');if((($('newPhone').value.match(/\d/g)||[]).length)<7)throw Error('Enter a valid phone number.');if(!$('newSlot').value)throw Error('Choose a collection time.');b.disabled=true;$('newMsg').textContent='Creating order…';const r=await api('staff_create',{collection_date:$('newDate').value,collection_slot:$('newSlot').value,customer_name:$('newName').value.trim(),customer_phone:$('newPhone').value.trim(),meals:x.d.meals,extras:x.d.extras,payment_status:$('newPayment').value,amount_paid_pence:x.paid,request_id:crypto.randomUUID()});$('newMsg').className='message ok';$('newMsg').textContent='SR-'+String(r.order.order_number).padStart(3,'0')+' created successfully.';setRows('new',empty());$('newPaid').value='0.00';syncNew()}catch(e){$('newMsg').className='message bad';$('newMsg').textContent=e.message}finally{b.disabled=false}}
function paidSoFar(o){return Math.max(0,Number(o.deposit_pence)||0)+(o.balance_payment_status==='paid'?Math.max(0,Number(o.balance_paid_pence??o.balance_pence)||0):0)}
function editable(o){return o.payment_status==='completed'&&!['rejected','no_show','payment_failed','collected'].includes(String(o.status||''))&&!o.points_awarded}
function mapOrder(o){const d=empty();for(const i of o.items||[])if((i.kind==='meals'||i.kind==='extras')&&Object.hasOwn(d[i.kind],i.key))d[i.kind][i.key]=Number(i.qty)||0;return d}
async function loadEdit(){try{$('editMsg').textContent='Loading orders…';const s=await api('status',$('editDate').value?{collection_date:$('editDate').value}:{});editSettings=settingsConfig(s);$('editDate').value=editSettings.date;$('editSlot').innerHTML=editSettings.slots.map(x=>`<option>${esc(x)}</option>`).join('');const a=await api('all_orders',{collection_date:editSettings.date});editOrders=(a.orders||[]).filter(editable).sort((x,y)=>String(x.collection_slot).localeCompare(String(y.collection_slot)));$('editOrder').innerHTML='<option value="">Choose an order…</option>'+editOrders.map(o=>`<option value="${esc(o.id)}">SR-${String(o.order_number).padStart(3,'0')} • ${esc(o.collection_slot)} • ${esc(o.customer_name||'Customer')}</option>`).join('');$('editForm').classList.add('hide');$('editMsg').textContent=editOrders.length?'':'No editable paid Sunday Roast orders found.'}catch(e){$('editMsg').className='message bad';$('editMsg').textContent=e.message}}
function chooseEdit(){editCurrent=editOrders.find(o=>o.id===$('editOrder').value)||null;if(!editCurrent){$('editForm').classList.add('hide');return}const d=mapOrder(editCurrent);setRows('edit',d);$('editSlot').value=editCurrent.collection_slot||'';$('editForm').classList.remove('hide');syncEdit()}
function syncEdit(){if(!editCurrent)return;const d=read('edit'),t=total(d),p=paidSoFar(editCurrent);$('editTotal').textContent=money(t);$('editPaid').textContent=money(p);$('editBalance').textContent=money(Math.max(0,t-p));$('saveEdit').disabled=!hasMeal(d)||t<p||!$('editSlot').value;$('editMsg').className='message '+(t<p?'bad':'');$('editMsg').textContent=t<p?'The edited total cannot be below the amount already paid.':'';return{d,t,p}}
async function saveEdit(){const b=$('saveEdit');try{const x=syncEdit();if(!x||b.disabled)throw Error('Check the order before saving.');b.disabled=true;$('editMsg').textContent='Saving changes…';const r=await amend(editCurrent.id,{collection_slot:$('editSlot').value,meals:x.d.meals,extras:x.d.extras});const bal=Number(r.order?.balance_pence)||0;$('editMsg').className='message ok';$('editMsg').textContent='SR-'+String(editCurrent.order_number).padStart(3,'0')+' updated. '+(bal?money(bal)+' balance due.':'Order is fully paid.');await loadEdit()}catch(e){$('editMsg').className='message bad';$('editMsg').textContent=e.message}finally{b.disabled=false}}
$('newMeals').innerHTML=rows('new','meals',meals);$('newExtras').innerHTML=rows('new','extras',extras);$('editMeals').innerHTML=rows('edit','meals',meals);$('editExtras').innerHTML=rows('edit','extras',extras);
$('srLaunch').onclick=()=>{$('srModal').classList.remove('hide');loadNew()};$('srClose').onclick=()=>$('srModal').classList.add('hide');$('newTab').onclick=()=>{$('newPane').classList.remove('hide');$('editPane').classList.add('hide');$('newTab').classList.add('on');$('editTab').classList.remove('on')};$('editTab').onclick=()=>{$('newPane').classList.add('hide');$('editPane').classList.remove('hide');$('editTab').classList.add('on');$('newTab').classList.remove('on');loadEdit()};$('newDate').onchange=loadNew;$('editDate').onchange=loadEdit;$('editOrder').onchange=chooseEdit;$('newPayment').onchange=syncNew;$('newPaid').oninput=syncNew;$('newPane').addEventListener('input',e=>{if(e.target.matches('[data-new-kind]'))syncNew()});$('editPane').addEventListener('input',e=>{if(e.target.matches('[data-edit-kind]'))syncEdit()});$('editSlot').onchange=syncEdit;$('createOrder').onclick=createOrder;$('saveEdit').onclick=saveEdit;syncNew();
})();
</script>
</body>
</html>
