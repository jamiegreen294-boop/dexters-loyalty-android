<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Dexter's Scanner Bridge</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font:18px system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#12223a;border:1px solid #2e466c;border-radius:22px;padding:22px;margin:16px 0}h1{color:#ffd43b}.code{width:100%;font-size:34px;letter-spacing:8px;text-align:center;padding:15px;border-radius:14px;border:2px solid #ffd43b;background:#fff;color:#111}.btn{width:100%;padding:17px;margin:8px 0;border:0;border-radius:14px;background:#ffd43b;color:#07111f;font-size:20px;font-weight:1000}.secondary{background:#2a4165;color:#fff}.good{color:#9ff3c5}.bad{color:#ffb4b4}video{width:100%;max-height:58vh;background:#000;border-radius:18px}input.scan{width:100%;padding:14px;border-radius:12px;border:1px solid #4c658c;font-size:20px}.hidden{display:none}.brand{text-align:center;font-weight:1000;letter-spacing:.05em}</style></head><body><main class="wrap"><div class="brand">DEXTER'S · FOODHUB 1008</div><section id="pairCard" class="card"><h1>Pair Scanner</h1><p>Enter the six-digit code shown on the Dexter's POS.</p><input id="pairCode" class="code" inputmode="numeric" maxlength="6" placeholder="000000"><button id="pairBtn" class="btn">PAIR WITH POS</button><p id="pairStatus"></p></section><section id="scanCard" class="card hidden"><h1>Scanner Ready</h1><p id="scanStatus" class="good">Paired over the internet.</p><video id="video" muted playsinline></video><button id="cameraBtn" class="btn">START CAMERA SCANNER</button><button id="stopBtn" class="btn secondary hidden">STOP CAMERA</button><hr><p>Manual test/fallback:</p><input id="manual" class="scan" autocomplete="off" placeholder="Scan or enter code"><button id="sendBtn" class="btn secondary">SEND CODE</button><button id="unpairBtn" class="btn secondary">UNPAIR DEVICE</button></section></main><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>
const U='https://bpnkouymdvcogeaqjmxl.supabase.co/functions/v1/pc-pos-scanner-bridge-test',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa',KEY='dexters_foodhub_1008_scanner_token_v1';const $=id=>document.getElementById(id);let stream=null,frame=0,busy=false,lastValue='',lastAt=0;
async function api(body){const r=await fetch(U,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Connection failed');return d}function token(){return localStorage.getItem(KEY)||''}function show(){const paired=!!token();$('pairCard').classList.toggle('hidden',paired);$('scanCard').classList.toggle('hidden',!paired)}
async function pair(){const code=$('pairCode').value.replace(/\D/g,'').slice(0,6);$('pairStatus').textContent='Connecting…';try{const d=await api({action:'claim_pair',pair_code:code});localStorage.setItem(KEY,d.scanner_token);show()}catch(e){$('pairStatus').textContent=e.message;$('pairStatus').className='bad'}}function typeOf(v){return /^DEXTERS(?:_|:|-)|^\d{6}$/i.test(v)?'loyalty':'auto'}
async function send(value){value=String(value||'').trim();if(!value||busy)return;const now=Date.now();if(value===lastValue&&now-lastAt<1800)return;busy=true;$('scanStatus').textContent='Sending…';try{await api({action:'send_scan',scanner_token:token(),value,type:typeOf(value)});lastValue=value;lastAt=now;$('scanStatus').textContent='SENT TO POS ✓ '+value;$('scanStatus').className='good';navigator.vibrate?.([100,60,100]);$('manual').value=''}catch(e){$('scanStatus').textContent=e.message;$('scanStatus').className='bad';if(/not paired/i.test(e.message)){localStorage.removeItem(KEY);stop();show()}}finally{busy=false}}
async function camera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});$('video').srcObject=stream;await $('video').play();$('cameraBtn').classList.add('hidden');$('stopBtn').classList.remove('hidden');$('scanStatus').textContent='Camera scanning…';tick()}catch(e){$('scanStatus').textContent='Camera unavailable: '+e.message;$('scanStatus').className='bad'}}function stop(){if(frame)cancelAnimationFrame(frame);frame=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('cameraBtn').classList.remove('hidden');$('stopBtn').classList.add('hidden')}
async function tick(){if(!stream)return;const v=$('video');if(v.readyState>=2&&v.videoWidth){const c=document.createElement('canvas'),scale=Math.min(1,900/v.videoWidth);c.width=v.videoWidth*scale;c.height=v.videoHeight*scale;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);try{const im=x.getImageData(0,0,c.width,c.height),q=window.jsQR?.(im.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q?.data)await send(q.data)}catch{}}frame=requestAnimationFrame(tick)}
$('pairCode').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);$('pairBtn').onclick=pair;$('cameraBtn').onclick=camera;$('stopBtn').onclick=stop;$('sendBtn').onclick=()=>send($('manual').value);$('manual').onkeydown=e=>{if(e.key==='Enter')send(e.target.value)};$('unpairBtn').onclick=()=>{stop();localStorage.removeItem(KEY);show()};show();
</script></body></html>
