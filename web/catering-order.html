<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140a20"><title>Catering Order • Dexter’s</title><link rel="stylesheet" href="/legal.css"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:block;margin:12px 0;font-weight:800}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;margin-top:5px;padding:12px;border:1px solid #ffffff35;border-radius:10px;background:#0e1726;color:#fff}.btn{border:0;border-radius:12px;padding:13px 15px;font-weight:900;background:linear-gradient(110deg,#ffd43b,#ff8a00);color:#15100a}.status{padding:12px;border-radius:12px;background:#ffffff0d;margin:10px 0}.ok{color:#9ff3c5}.bad{color:#ffb4c0}@media(max-width:620px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav><a href="/">← Dexter’s Loyalty App</a><a href="/allergens.html">Allergens</a></nav><header><p class="eyebrow">DEXTER’S CATERING</p><h1>Build a catering request</h1><p class="muted">For collection only. Please allow at least 48 hours. Staff will check availability, allergens and the final price before confirming.</p></header><section class="card" id="closed">Checking catering availability…</section><section class="card" id="form" hidden><div class="grid"><label class="field">Event or company name<input id="event" maxlength="160"></label><label class="field">Number of people<input id="people" type="number" min="1" max="500" value="12"></label><label class="field">Collection date<input id="date" type="date"></label><label class="field">Collection time<input id="time" type="time" value="12:30"></label></div><label class="field">Package<select id="package"><option value="breakfast">Breakfast rolls buffet</option><option value="sandwiches">Sandwich & wrap platters</option><option value="hot">Hot lunch buffet</option><option value="custom">Custom Dexter’s menu order</option></select></label><div class="grid"><label class="field">Your name<input id="name" autocomplete="name"></label><label class="field">Phone number<input id="phone" autocomplete="tel"></label></div><label class="field">Dietary requirements<textarea id="diet" rows="3"></textarea></label><label class="field">Allergies or intolerances<textarea id="allergy" rows="3" placeholder="Write none if there are none"></textarea></label><label class="field"><input id="confirm" type="checkbox" style="width:auto"> I have checked these details and understand this is a request, not a confirmed order.</label><button class="btn" id="send">Send catering request</button><div id="message" class="status"></div></section><section class="card"><h2>My recent catering requests</h2><div id="history">Sign in to view requests.</div></section></main><script>(function(){const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa',A=U+'/functions/v1/loyalty-growth-api';function token(){try{const j=JSON.parse(localStorage.getItem('sb-bpnkouymdvcogeaqjmxl-auth-token')||'null'),s=j?.currentSession||j?.session||j;return s?.access_token||''}catch{return''}}async function call(action,p={}){const t=token();if(!t)throw Error('Please sign in through the Loyalty App first.');const r=await fetch(A,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({action,...p})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const min=new Date(Date.now()+48*3600000);$('date').min=min.toISOString().slice(0,10);$('date').value=$('date').min;async function history(){try{const d=await call('my_catering');$('history').innerHTML=d.requests.map(x=>'<div class="status"><b>'+esc(x.event_name)+'</b><br>'+new Date(x.collection_at).toLocaleString('en-GB')+' · '+esc(x.package_name)+'<br><span class="'+(x.status==='approved'?'ok':'')+'">'+esc(x.status.replaceAll('_',' '))+'</span></div>').join('')||'No requests yet.'}catch(e){$('history').textContent=e.message}}async function boot(){try{const d=await call('status');$('closed').textContent=d.settings.catering_enabled?'Catering is open for requests.':'Catering ordering is currently switched off by staff.';$('form').hidden=!d.settings.catering_enabled;if(d.settings.catering_enabled)$('closed').classList.add('ok')}catch(e){$('closed').textContent=e.message;$('closed').classList.add('bad')}history()}$('send').onclick=async()=>{const b=$('send'),m=$('message');if(!$('confirm').checked){m.textContent='Please confirm the request details.';m.className='status bad';return}b.disabled=true;m.textContent='Sending…';try{const p=$('package'),dt=$('date').value+'T'+$('time').value+':00';await call('create_catering',{event_name:$('event').value,people:$('people').value,collection_at:new Date(dt).toISOString(),package_key:p.value,package_name:p.selectedOptions[0].textContent,customer_name:$('name').value,customer_phone:$('phone').value,dietary_notes:$('diet').value,allergy_declaration:$('allergy').value});m.textContent='Request sent. Dexter’s staff will review it before it is confirmed.';m.className='status ok';history()}catch(e){m.textContent=e.message;m.className='status bad'}finally{b.disabled=false}};boot()})();</script></body></html>
