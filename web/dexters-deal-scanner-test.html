<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Deal Scanner Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#08111d;color:#fff;font-family:system-ui}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#132038;border:1px solid #ffffff18;border-radius:18px;padding:16px;margin-bottom:14px}.badge{display:inline-block;background:#ff315f;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.good{color:#9ff3c5;font-weight:900}.bad{color:#ffb4b4;font-weight:900}.note{color:#aab4c3;font-size:13px}button,input{width:100%;box-sizing:border-box;border-radius:12px;padding:13px;font-weight:800}button{border:0;background:#ffd43b;color:#08101d;margin-top:10px}input{background:#081422;color:#fff;border:1px solid #ffffff30;margin-top:8px}video{width:100%;border-radius:14px;background:#000;max-height:360px}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><span class="badge">STAFF TEST</span><h1>Scan Dexter's Deal QR</h1><p class="note">Only a signed-in staff/admin account can redeem a deal.</p></div><div id="auth" class="card">Checking staff access…</div><div id="scanner" class="card hidden"><video id="video" playsinline></video><button id="start">START CAMERA SCANNER</button><p class="note">Fallback: paste the QR value below if the browser camera scanner is unavailable.</p><input id="code" placeholder="DEXTERS_DEAL:claim-id"><button id="redeem">REDEEM DEAL</button></div><div id="result" class="card hidden"></div></div><script>const URL='https://bpnkouymdvcogeaqjmxl.supabase.co',KEY='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa';const sb=supabase.createClient(URL,KEY);let stream=null,detecting=false;function show(id,on=true){document.getElementById(id).classList.toggle('hidden',!on)}function msg(t,ok){const r=document.getElementById('result');r.className='card '+(ok?'good':'bad');r.textContent=t;show('result')}async function access(){const {data:{user}}=await sb.auth.getUser();if(!user){document.getElementById('auth').textContent='Sign in to the Dexter’s staff/admin app first.';return}const {data,error}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(error||!data||!['admin','staff'].includes(data.role)){document.getElementById('auth').textContent='Staff/admin access required.';return}document.getElementById('auth').innerHTML='<span class="good">Staff access confirmed.</span>';show('scanner')}function claimId(raw){raw=(raw||'').trim();if(raw.startsWith('DEXTERS_DEAL:'))raw=raw.slice(13);return /^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(raw)?raw:null}async function redeemRaw(raw){const id=claimId(raw);if(!id){msg('Invalid Dexter’s deal QR.',false);return}const {data,error}=await sb.rpc('loyalty_redeem_deal',{p_claim_id:id});if(error){msg(error.message,false);return}if(data?.ok){msg('REDEEMED — the deal will now disappear from that customer’s Deals page.',true)}else if(data?.status==='already_redeemed'){msg('BLOCKED — this deal has already been redeemed.',false)}else if(data?.status==='expired'){msg('BLOCKED — this deal has expired.',false)}else msg('Invalid deal QR.',false)}document.getElementById('redeem').onclick=()=>redeemRaw(document.getElementById('code').value);document.getElementById('start').onclick=async()=>{if(!('BarcodeDetector'in window)){msg('Camera QR detection is not available in this browser. Use the paste box instead.',false);return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=document.getElementById('video');v.srcObject=stream;await v.play();const detector=new BarcodeDetector({formats:['qr_code']});detecting=true;const loop=async()=>{if(!detecting)return;try{const codes=await detector.detect(v);if(codes.length){detecting=false;stream.getTracks().forEach(t=>t.stop());document.getElementById('code').value=codes[0].rawValue;await redeemRaw(codes[0].rawValue);return}}catch{}requestAnimationFrame(loop)};loop()}catch(e){msg('Camera could not start. Use the paste box instead.',false)}};access();</script></body></html>
