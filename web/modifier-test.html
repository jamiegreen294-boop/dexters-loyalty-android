<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Modifier Test</title><style>body{font-family:system-ui;margin:0;background:#08101d;color:#fff}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#132038;border-radius:18px;padding:18px;margin:12px 0}.tag{display:inline-block;background:#243a5e;padding:6px 10px;border-radius:999px;font-size:12px}.price{color:#ffd43b;font-size:24px;font-weight:900}.group{border-top:1px solid #ffffff20;padding-top:14px;margin-top:14px}.group h3{margin:0 0 4px}.req{font-size:12px;color:#ffd43b}.opt{display:flex;justify-content:space-between;gap:10px;background:#0d1829;border:1px solid #2b4161;border-radius:12px;padding:12px;margin:7px 0}.opt label{flex:1}.total{position:sticky;bottom:10px;background:#ffd43b;color:#08101d;border-radius:15px;padding:14px;font-size:20px;font-weight:900;display:flex;justify-content:space-between}.note{opacity:.7;font-size:13px}</style></head><body><div class="wrap"><span class="tag">TEST ONLY — LIVE APP UNCHANGED</span><h1>Dexter's Hot Roll</h1><div class="card"><h2>Square Sausage</h2><div class="price">£2.50</div><p class="note">Choose your options below. Paid extras update the total instantly.</p><div class="group"><h3>Choose your roll</h3><div class="req">Required</div><div class="opt"><label><input type="radio" name="roll" checked> Soft roll</label><b>Included</b></div><div class="opt"><label><input type="radio" name="roll"> Crispy roll</label><b>Included</b></div></div><div class="group"><h3>Butter</h3><div class="req">Required</div><div class="opt"><label><input type="radio" name="butter" checked> Butter</label><b>Included</b></div><div class="opt"><label><input type="radio" name="butter"> No butter</label><b>Included</b></div></div><div class="group"><h3>Sauce</h3><div class="opt"><label><input type="radio" name="sauce" checked> No sauce</label><b>Free</b></div><div class="opt"><label><input type="radio" name="sauce"> Brown sauce</label><b>Free</b></div><div class="opt"><label><input type="radio" name="sauce"> Tomato sauce</label><b>Free</b></div></div><div class="group"><h3>Add breakfast extras</h3><div id="extras"></div></div></div><div class="total"><span>Total</span><span id="total">£2.50</span></div></div><script>const extras=[['2 × Bacon',1],['1 × Square sausage',1],['1 × Black pudding',1],['2 × Link sausages',1],['2 × Potato scones',.5],['1 × Egg',.5],['2 × Hash browns',1],['2 × Slices of toast',1.5],['Add onion',.5]];const box=document.getElementById('extras');box.innerHTML=extras.map((x,i)=>`<div class="opt"><label><input type="checkbox" data-price="${x[1]}"> ${x[0]}</label><b>+£${x[1].toFixed(2)}</b></div>`).join('');function calc(){let t=2.5;document.querySelectorAll('[data-price]:checked').forEach(x=>t+=Number(x.dataset.price));document.getElementById('total').textContent='£'+t.toFixed(2)}document.querySelectorAll('[data-price]').forEach(x=>x.onchange=calc);</script></body></html>
