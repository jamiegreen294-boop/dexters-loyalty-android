<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><title>Dexter's Loyalty Signup & Consent — Test</title><style>

</style></head><body><main class="wrap"><section class="card"><span class="test">PRIVATE TEST — LIVE APP UI UNCHANGED</span><p class="eyebrow">DEXTER'S LOYALTY</p><h1>Create your account</h1><p class="muted">Safe test for customer details and consent capture before any live-app change.</p><form id="signupForm">
<label>Full name<input id="fullName" autocomplete="name" required></label><label>Mobile number<input id="phone" inputmode="tel" autocomplete="tel"></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
<label class="check"><input id="terms" type="checkbox" required><span>I accept Dexter's Terms & Conditions.</span></label><label class="check"><input id="privacy" type="checkbox" required><span>I have read and accept Dexter's Privacy Policy.</span></label>
<hr style="border:0;border-top:1px solid #ffffff18;margin:18px 0"><p class="muted"><b>Optional contact choices</b></p>
<label class="check"><input id="marketing" type="checkbox"><span>I agree to receive Dexter's marketing and offers.</span></label><label class="check"><input id="sms" type="checkbox"><span>I agree to receive SMS messages.</span></label><label class="check"><input id="emailConsent" type="checkbox"><span>I agree to receive marketing emails.</span></label>
<button id="createBtn" type="submit">Create test customer account</button><div id="status" class="status muted">Nothing submitted.</div></form><p class="muted">Consent version <b>1.0-test</b>.</p></section></main>
