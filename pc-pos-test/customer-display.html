<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Customer Display</title><style>body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px}.brand{font-size:42px;font-weight:900}.sub{color:#9eb0c5;margin-bottom:24px}.card{background:#0d1f35;border:1px solid #29496d;border-radius:18px;padding:24px}.row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid #27415e;font-size:26px}.row:last-child{border-bottom:0}.total{font-size:52px;font-weight:1000;color:#ffd43b;text-align:right;margin-top:22px}.customer{font-size:22px;margin:12px 0}.empty{font-size:30px;color:#9eb0c5;text-align:center;padding:70px 20px}.foot{margin-top:26px;text-align:center;color:#9eb0c5;font-size:20px}</style></head><body><div class="wrap"><div class="brand">DEXTER’S</div><div class="sub">Sit-in & Take Away · Your order</div><div id="customer" class="customer"></div><div class="card"><div id="items" class="empty">Your order will appear here.</div><div id="total" class="total">£0.00</div></div><div class="foot">Join Dexter’s Loyalty App for points, rewards and offers.</div></div><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const money=n=>'£'+Number(n||0).toFixed(2);function draw(x){const c=document.getElementById('customer'),it=document.getElementById('items'),t=document.getElementById('total');c.textContent=x?.customer?('Customer: '+x.customer):'';const rows=Array.isArray(x?.cart)?x.cart:[];it.className=rows.length?'':'empty';it.innerHTML=rows.length?rows.map(i=>'<div class="row"><span>'+(Number(i.qty)||1)+' × '+esc(i.name)+'</span><b>'+money((Number(i.qty)||1)*(Number(i.unit)||0))+'</b></div>').join(''):'Your order will appear here.';t.textContent=money(x?.total||0)}function read(){try{draw(JSON.parse(localStorage.getItem('dexters_customer_display_state')||'{}'))}catch{}}read();window.addEventListener('storage',e=>{if(e.key==='dexters_customer_display_state')read()});try{const bc=new BroadcastChannel('dexters-customer-display');bc.onmessage=e=>draw(e.data)}catch{}setInterval(read,1500);</script></body></html>
