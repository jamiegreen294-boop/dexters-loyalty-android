.lines{overflow:auto;padding:8px;scrollbar-width:none;-ms-overflow-style:none}.lines::-webkit-scrollbar{width:0;height:0;display:none}.line{background:#11223a;border:1px solid #223b59;border-radius:12px;padding:10px;margin-bottom:8px}.lrow{display:flex;gap:8px}.lname{font-weight:900;flex:1}.lcat{font-size:11px;color:#ffd43b;font-weight:900;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}.lprice{font-weight:900}.mods{font-size:12px;color:#c3cfdd;margin-top:5px;white-space:pre-line}.qty{display:flex;gap:6px;align-items:center;margin-top:8px}.qty button{border:0;border-radius:8px;padding:6px 10px;font-weight:900;background:#203a5d;color:#fff}.qty .plus{background:var(--accent);color:#08101d}.qty .remove{margin-left:auto;background:#5a1420}
.total{padding:12px;border-top:1px solid var(--line);background:#0d1b2f}.sumrow{display:flex;justify-content:space-between;margin:4px 0}.grand{font-size:26px;font-weight:1000}.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pay button{border:0;border-radius:13px;padding:14px;font-weight:1000}.cash{background:#22c55e;color:#04210d}.cardbtn{background:#4d7cff;color:#fff}.send{grid-column:1/-1;background:var(--accent);color:#08101d}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}.hide{display:none}.box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#10213a;border:1px solid #31506f;border-radius:20px;padding:16px}.box h2{margin-top:0}.group{background:#0b192b;border-radius:14px;padding:12px;margin:10px 0}.gname{font-weight:1000;margin-bottom:8px}.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.opt{border:1px solid #31506f;background:#142945;color:#fff;border-radius:12px;padding:12px;text-align:left;font-weight:800}.opt.on{background:var(--accent);color:#08101d}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:1000}.cancel{background:#263c58;color:#fff}.confirm{background:var(--accent)}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #31506f;background:#09182a;color:#fff;margin:6px 0}.held{padding:8px;background:#0b192b;border-radius:12px;margin:8px 0}.held button{margin-top:6px;border:0;border-radius:9px;padding:8px 10px;font-weight:800}.bad{color:#ffadb8}.ok{color:#8ff0b3}
@media(max-width:950px){.main{grid-template-columns:140px 1fr 310px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style>

<script>
const U='https://bpnkouymdvcogeaqjmxl.supabase.co',K='sb_publishable_v6rJbF4IfGZTKtbuQtmsmQ_lS3sXWFa',TABLE_API=U+'/functions/v1/uber-table-service-pc-test-api';let TABLE_STATE={orders:[],bill_requests:[]};
const S={cats:[],groups:new Map(),cat:'',cart:[],mode:'Counter',discount:0,note:'',customer:'',phone:'',editing:null,selected:new Map(),session:null,staffEmail:'',staffRole:'staff',tableNo:'1'};
const PLACE_LABELS={1:'Inside Table 1',2:'Inside Table 2',3:'Outside Table 1',4:'Outside Table 2',5:'Bar Chair 1',6:'Bar Chair 2',7:'Bar Chair 3'};const placeLabel=n=>PLACE_LABELS[Number(n)]||('Table '+n);const $=id=>document.getElementById(id),money=n=>'£'+Number(n||0).toFixed(2),num=v=>{const m=String(v||'').replace(',','.').match(/(\d+(?:\.\d{1,2})?)/);return m?Number(m[1]):0},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function itemById(id){for(const c of S.cats)for(const i of(c.items||[]))if(String(i.id||i.name)===String(id))return {...i,category_name:c.name};return null}
async function loadMenu(){
 $('status').textContent='Loading Dexter’s menu…';
 try{
  const r=await fetch(U+'/rest/v1/rpc/loyalty_menu_public',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}'});
  const d=await r.json();S.cats=Array.isArray(d)?d:[];if(!S.cat&&S.cats[0])S.cat=S.cats[0].name;
  await loadModifiers();renderCats();renderItems();$('status').textContent='Menu loaded · Dexter’s POS';
 }catch(e){$('status').textContent='Menu load failed';}
}
async function loadModifiers(){
 const rows=[],seen=new Set();for(let page=0,off=0;page<20;page++){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);let r;try{r=await fetch(U+'/rest/v1/rpc/loyalty_modifier_public?order=menu_item_id.asc,group_id.asc,option_id.asc&limit=500&offset='+off,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:'{}',signal:ctrl.signal})}finally{clearTimeout(timer)}if(!r.ok)break;const p=await r.json();if(!Array.isArray(p)||!p.length)break;const signature=p.length+':'+String(p[0]?.option_id||'')+':'+String(p[p.length-1]?.option_id||'');if(seen.has(signature))break;seen.add(signature);rows.push(...p);off+=p.length;if(p.length<500)break}
 const map=new Map();for(const row of rows){const iid=String(row.menu_item_id),gid=String(row.group_id);let gs=map.get(iid);if(!gs){gs=[];map.set(iid,gs)}let g=gs.find(x=>x.id===gid);if(!g){g={id:gid,name:row.group_name,required:!!row.required,min:Number(row.min_select||0),max:row.max_select==null?null:Number(row.max_select),type:row.selection_type,sort:Number(row.group_sort_order||0),options:[]};gs.push(g)}g.options.push({id:String(row.option_id),name:row.option_name,price:Number(row.price_delta||0),sort:Number(row.option_sort_order||0)})}
 for(const gs of map.values()){gs.sort((a,b)=>a.sort-b.sort);for(const g of gs)g.options.sort((a,b)=>a.sort-b.sort)}S.groups=map
}
function renderCats(){const q=$('search').value.trim().toLowerCase();$('cats').innerHTML=S.cats.filter(c=>!q||(c.items||[]).some(i=>(c.name+' '+i.name+' '+(i.description||'')).toLowerCase().includes(q))).map(c=>'<button class="cat '+(S.cat===c.name?'on':'')+'" data-cat="'+esc(c.name)+'">'+esc(c.name)+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;renderCats();renderItems()})}
function renderItems(){const q=$('search').value.trim().toLowerCase();let its=[];if(q){for(const c of S.cats)for(const i of(c.items||[]))if((c.name+' '+i.name+' '+(i.description||'')).toLowerCase().includes(q))its.push({...i,category_name:c.name})}else{const c=S.cats.find(x=>x.name===S.cat);its=(c?.items||[]).map(i=>({...i,category_name:c?.name||''}))}$('items').innerHTML=its.map(i=>'<button class="item '+(i.in_stock===false?'sold':'')+'" data-item="'+esc(i.id||i.name)+'" '+(i.in_stock===false?'disabled':'')+'><div><div class="iname">'+esc(i.name)+'</div><div class="idesc">'+esc(i.description||i.category_name||'')+'</div></div><div class="price">'+esc(i.price||money(0))+'</div></button>').join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>chooseItem(itemById(b.dataset.item)))}
function chooseItem(i){if(!i)return;const gs=S.groups.get(String(i.id||''))||[];if(!gs.length){addLine(i,[]);return}S.editing=i;S.selected=new Map();$('modTitle').textContent=i.name;$('modifierModal').classList.remove('hide');renderGroups()}
function renderGroups(){const gs=S.groups.get(String(S.editing?.id||''))||[];$('modGroups').innerHTML=gs.map(g=>'<div class="group"><div class="gname">'+esc(g.name)+(g.required?' *':'')+'</div><div class="opts">'+g.options.map(o=>'<button class="opt '+((S.selected.get(g.id)||new Set()).has(o.id)?'on':'')+'" data-g="'+g.id+'" data-o="'+o.id+'">'+esc(o.name)+(o.price?'<br><small>+'+money(o.price)+'</small>':'')+'</button>').join('')+'</div></div>').join('');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=gs.find(x=>x.id===b.dataset.g),set=new Set(S.selected.get(g.id)||[]);if(g.type==='single'||g.max===1){set.clear();set.add(b.dataset.o)}else{set.has(b.dataset.o)?set.delete(b.dataset.o):set.add(b.dataset.o);if(g.max&&set.size>g.max){set.delete([...set][0])}}S.selected.set(g.id,set);renderGroups()})}
function selectionsValid(){const gs=S.groups.get(String(S.editing?.id||''))||[];for(const g of gs){const n=(S.selected.get(g.id)||new Set()).size;if(n<Math.max(g.required?1:0,g.min||0))return g.name;if(g.max!=null&&n>g.max)return g.name}return ''}
function addLine(i,mods){const extra=mods.reduce((a,m)=>a+m.options.reduce((x,o)=>x+o.price,0),0);S.cart.push({key:Date.now()+Math.random(),id:i.id,name:i.name,category:i.category_name,base:num(i.price),mods,qty:1,unit:num(i.price)+extra});renderCart()}
function renderCart(){if(!S.cart.length)$('lines').innerHTML='<div style="color:#9eb0c5;padding:20px;text-align:center">No items in this sale.</div>';else $('lines').innerHTML=S.cart.map(l=>'<div class="line"><div class="lrow"><div class="lname">'+esc(l.name)+(l.category?'<div class="lcat">'+esc(l.category)+'</div>':'')+'</div><div class="lprice">'+money(l.unit*l.qty)+'</div></div>'+(l.mods.length?'<div class="mods">'+l.mods.map(m=>'↳ '+esc(m.name)+': '+m.options.map(o=>esc(o.name)).join(', ')).join('\n')+'</div>':'')+'<div class="qty"><button data-minus="'+l.key+'">−</button><b>'+l.qty+'</b><button class="plus" data-plus="'+l.key+'">+</button><button class="remove" data-remove="'+l.key+'">REMOVE</button></div></div>').join('');document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.plus,1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>changeQty(b.dataset.minus,-1));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{S.cart=S.cart.filter(x=>String(x.key)!==b.dataset.remove);renderCart()});const sub=S.cart.reduce((a,l)=>a+l.unit*l.qty,0),disc=Math.min(sub,S.discount);$('subtotal').textContent=money(sub);$('discount').textContent='-'+money(disc);$('total').textContent=money(sub-disc)}
function changeQty(k,d){const l=S.cart.find(x=>String(x.key)===String(k));if(!l)return;l.qty=Math.max(0,l.qty+d);if(!l.qty)S.cart=S.cart.filter(x=>x!==l);renderCart()}
function total(){const sub=S.cart.reduce((a,l)=>a+l.unit*l.qty,0);return Math.max(0,sub-Math.min(sub,S.discount))}
function clearSale(){S.cart=[];S.discount=0;S.note='';S.customer='';S.phone='';renderCart()}
function nextOrderNumber(){const d=new Date(),key='dexters-pos-order-seq-'+d.toISOString().slice(0,10),n=Number(localStorage.getItem(key)||0)+1;localStorage.setItem(key,String(n));return (S.mode==='Table'?'T':'C')+String(n).padStart(3,'0')}
function sales(){try{return JSON.parse(localStorage.getItem('dexters-pos-sales-v1')||'[]')}catch{return []}}
function saveSale(s){const a=sales();a.unshift(s);localStorage.setItem('dexters-pos-sales-v1',JSON.stringify(a.slice(0,1000)))}
function showSales(){const a=sales();simple('Sales history',a.length?a.slice(0,100).map(x=>'<div class="held"><b>#'+esc(x.orderNumber)+'</b> · '+new Date(x.createdAt).toLocaleString('en-GB')+'<br>'+esc(x.method)+' · '+esc(x.mode)+' · <b>'+money(x.total)+'</b> · '+esc(x.staff||'')+(x.voided?'<br><span class="bad">VOIDED: '+esc(x.voidReason||'')+'</span>':'')+'<br><button data-reprint="'+esc(x.id)+'">Receipt</button> '+(!x.voided?'<button data-void="'+esc(x.id)+'">Void sale</button>':'')+'</div>').join(''):'No sales recorded on this POS yet.',()=>{});setTimeout(bindSaleActions,0)}
function bindSaleActions(){document.querySelectorAll('[data-reprint]').forEach(b=>b.onclick=()=>receiptFor(b.dataset.reprint));document.querySelectorAll('[data-void]').forEach(b=>b.onclick=()=>voidSale(b.dataset.void))}
function receiptFor(id){const x=sales().find(v=>String(v.id)===String(id));if(!x)return;const lines=x.items.map(l=>l.qty+' × '+l.name+'  '+money(l.unit*l.qty)).join('\\n');const staff=String(x.staffName||S.staffName||'Dexter’s staff').trim().split(/\s+/)[0]||'Staff',win='https://dextersspot.co.uk/?open=spin';const txt="DEXTER'S\\nPOS RECEIPT\\n#"+x.orderNumber+'\\n'+new Date(x.createdAt).toLocaleString('en-GB')+'\\n----------------\\n'+lines+'\\n----------------\\nTOTAL '+money(x.total)+'\\n'+x.method+'\\nServed by: '+staff+'\\n\\nSCAN TO WIN\\n'+win;localStorage.setItem('dexters-pos-last-receipt',txt);$('status').textContent='Receipt prepared for #'+x.orderNumber+'.';try{location.href='dexterscitaq://print-pos?payload='+encodeURIComponent(btoa(unescape(encodeURIComponent(txt))))}catch(e){}}

function cashUp(){const day=new Date().toISOString().slice(0,10),a=sales().filter(x=>String(x.createdAt).slice(0,10)===day&&!x.voided),cash=a.filter(x=>x.method==='Cash').reduce((s,x)=>s+x.total,0),card=a.filter(x=>x.method==='Card').reduce((s,x)=>s+x.total,0),voids=sales().filter(x=>String(x.createdAt).slice(0,10)===day&&x.voided).reduce((s,x)=>s+x.total,0);const report="DEXTER'S POS CASH UP\\nDate: "+day+"\\nSales: "+a.length+"\\nCash: "+money(cash)+"\\nCard: "+money(card)+"\\nVoids/refunds: "+money(voids)+"\\nNet: "+money(cash+card);simple('Cash up — '+day,'<div class="held"><div class="sumrow"><span>Completed sales</span><b>'+a.length+'</b></div><div class="sumrow"><span>Cash</span><b>'+money(cash)+'</b></div><div class="sumrow"><span>Card</span><b>'+money(card)+'</b></div><div class="sumrow"><span>Voids / refunds</span><b>'+money(voids)+'</b></div><div class="sumrow grand"><span>Net sales</span><span>'+money(cash+card)+'</span></div></div><textarea class="field" rows="7" readonly>'+esc(report)+'</textarea>',()=>{})}

const $p=id=>document.getElementById(id);
const memStore=new Map();
function cookieGet(k){try{const n=encodeURIComponent(k)+'=';const hit=document.cookie.split('; ').find(x=>x.startsWith(n));return hit?decodeURIComponent(hit.slice(n.length)):''}catch{return''}}
function cookieSet(k,v){try{document.cookie=encodeURIComponent(k)+'='+encodeURIComponent(String(v))+'; Path=/; Max-Age=31536000; SameSite=Lax';return cookieGet(k)===String(v)}catch{return false}}
function cookieRemove(k){try{document.cookie=encodeURIComponent(k)+'=; Path=/; Max-Age=0; SameSite=Lax'}catch{}}
const storage={
 get:k=>{
   try{const v=localStorage.getItem(k);if(v)return v}catch{}
   try{const v=sessionStorage.getItem(k);if(v)return v}catch{}
   const c=cookieGet(k);if(c)return c;
   return memStore.get(k)||''
 },
 set:(k,v)=>{
   const val=String(v);memStore.set(k,val);
   try{localStorage.setItem(k,val);return true}catch{}
   try{sessionStorage.setItem(k,val);return true}catch{}
   if(k!=='dexters-pos-session'&&cookieSet(k,val))return true;
   // The active Supabase session only needs to live in memory because every fresh POS open requires a staff PIN.
   // Do not reject a valid PIN merely because this Windows browser blocks persistent site storage.
   if(k==='dexters-pos-session')return true;
   return false
 },
 remove:k=>{
   memStore.delete(k);
   try{localStorage.removeItem(k)}catch{}
   try{sessionStorage.removeItem(k)}catch{}
   cookieRemove(k)
 }
};
function ensurePinStyle(){if(document.getElementById('dextersPcPinStyle'))return;const st=document.createElement('style');st.id='dextersPcPinStyle';st.textContent=`

function pinShell(title,subtitle,body){return '<div class="pcPinHead"><div class="pcPinBrand"><strong>Dexter\'s POS</strong><span class="pcPinBadge">STAFF</span></div><h2>'+title+'</h2><p class="pcPinSub">'+subtitle+'</p></div><div class="pcPinBody">'+body+'</div>'}

async function renderLogin(){const b=gateBox();if(!b)return;b.innerHTML=pinShell('Staff sign in','Choose your name','<div id="pcUsers">Loading staff…</div><button id="pcPinSetupAgain">SET UP THIS DEVICE AGAIN</button>');try{const x=await call('users',{device_id:storage.get(DEV_ID),device_secret:storage.get(DEV_SEC)}),users=x.users||[];const box=b.querySelector('#pcUsers');box.innerHTML=users.length?'<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">'+users.map(u=>'<button class="pcUser" data-id="'+String(u.id).replace(/"/g,'')+'" data-name="'+String(u.name||'Staff').replace(/"/g,'&quot;')+'" style="padding:18px 8px">'+String(u.name||'Staff').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'<br><small>'+String(u.role||'staff')+'</small></button>').join('')+'</div>':'<p>No PIN users are set up yet.</p>';box.querySelectorAll('.pcUser').forEach(btn=>btn.onclick=()=>pinFor(btn.dataset.id,btn.dataset.name))}catch(e){b.querySelector('#pcUsers').innerHTML='<p class="bad">'+e.message+'</p>'}b.querySelector('#pcPinSetupAgain').onclick=renderSetup;function pinFor(id,name){storage.set(USER_ID,id);storage.set(USER_NAME,name);b.innerHTML=pinShell(name,'Enter your staff PIN',keypadHtml()+'<button id="pcChooseAgain">CHOOSE ANOTHER NAME</button>');let pin='';const dots=b.querySelector('#pcPinDots'),msg=b.querySelector('#pcPinMsg'),submit=b.querySelector('#pcPinSubmit');function draw(){dots.textContent=Array.from({length:Math.max(4,pin.length)},(_,i)=>i<pin.length?'●':'○').join(' ');submit.disabled=pin.length<4}function press(k){if(k==='CLEAR')pin='';else if(k==='⌫')pin=pin.slice(0,-1);else if(/^\d$/.test(k)&&pin.length<6)pin+=k;msg.textContent='';draw()}b.querySelectorAll('.pcPinKey').forEach(y=>y.onclick=()=>press(y.dataset.k));submit.onclick=async()=>{submit.disabled=true;msg.textContent='Checking PIN…';try{const y=await call('login',{device_id:storage.get(DEV_ID),device_secret:storage.get(DEV_SEC),user_id:id,pin});saveSession(y);S.sess
