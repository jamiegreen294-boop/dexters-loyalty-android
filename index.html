<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Loyalty</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="loading" style="font-family:Arial,sans-serif;padding:24px;text-align:center">Loading Dexter's Loyalty…</div><script>(async()=>{try{const files=['/web/app-payload-1.txt','/web/app-payload-2.txt','/web/app-payload-3.txt','/web/app-payload-4.txt'];const rs=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));if(rs.some(r=>!r.ok))throw new Error('payload');const b=(await Promise.all(rs.map(r=>r.text()))).join('').trim();const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const h=new TextDecoder().decode(pako.ungzip(u));document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:24px;text-align:center"><b>Dexter\'s Loyalty</b><br><br>Please close and reopen the app.</div>';console.error(e)}})();</script></body></html>
