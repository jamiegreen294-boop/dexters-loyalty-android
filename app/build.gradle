plugins { id 'com.android.application' }

android {
    namespace 'co.dexters.loyalty'
    compileSdk 35

    defaultConfig {
        applicationId 'co.dexters.businessphone'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        resValue 'string', 'app_name', "Dexter's Business Phone"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', "Dexter's Business Phone Test"
        }
    }
}
