plugins { id 'com.android.application' }

android {
    namespace 'co.dexters.loyalty'
    compileSdk 35

    defaultConfig {
        applicationId 'co.dexters.loyalty'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
        resValue 'string', 'app_name', 'Dexters Loyalty'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            resValue 'string', 'app_name', 'Dexters Loyalty Test'
        }
    }
}
