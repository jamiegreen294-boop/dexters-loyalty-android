<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1526">
<title>Dexter’s Staff — Manual Sunday Roast Test</title>
<link rel="stylesheet" href="/sunday/style.css">
<style>
.staff-wrap{max-width:760px;margin:0 auto;padding:18px}
.test-banner{background:#7a2e00;color:#fff;padding:12px;border-radius:12px;margin:12px 0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field input,.field select,.field textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #53657d;background:#0f1d31;color:#fff}
.payment-box{padding:12px;border:1px solid #53657d;border-radius:12px;margin-top:12px}
.order-card{padding:14px;border:1px solid #53657d;border-radius:12px;margin:10px 0;background:#101d2e}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#253852;margin-right:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="staff-wrap">
<div class="toolbar"><a href="/">← Back to Dexter’s</a><strong>Staff/Admin test</strong></div>
<div class="test-banner">TEST ONLY — saves on this device only. No live orders or payments are changed.</div>
<header>
<span class="eyebrow">Dexter’s Staff/Admin</span>
<h1>Add Manual Sunday Roast</h1>
<p class="muted">Use this for phone, walk-in or already-paid pre-orders.</p>
</header>

<section class="card">
<div class="grid">
<label class="field">Customer name<input id="customerName" maxlength="120" placeholder="Customer name"></label>
<label class="field">Phone<input id="customerPhone" maxlength="40" inputmode="tel" placeholder="Mobile number"></label>
<label class="field">Roast
<select id="meal">
<option value="beef">Adult Beef Roast — £14.99</option>
<option value="chicken">Adult Chicken Roast — £14.99</option>
<option value="kids_beef">Kids Beef Roast — £9.99</option>
<option value="kids_chicken">Kids Chicken Roast — £9.99</option>
</select></label>
<label class="field">Quantity<input id="qty" type="number" min="1" max="50" value="1"></label>
<label class="field">Collection date<input id="collectionDate" type="date"></label>
<label class="field">Collection time<input id="collectionTime" type="time" min="11:00" max="14:45"></label>
</div>
<label class="field">Notes<textarea id="notes" rows="3" maxlength="500" placeholder="Dietary note, phone order details, etc."></textarea></label>

<div class="payment-box">
<strong>Payment status</strong>
<label class="field">Status
<select id="paymentStatus">
<option value="paid_full">Paid in Full</option>
<option value="deposit_paid">Deposit Paid</option>
<option value="unpaid">Unpaid</option>
</select></label>
<label class="field">Amount already paid (£)<input id="amountPaid" type="number" min="0" step="0.01" value="14.99"></label>
<div class="row"><span>Order total</span><strong id="orderTotal">£14.99</strong></div>
<div class="row"><span>Balance remaining</span><strong id="balance">£0.00</strong></div>
</div>

<div id="message" class="notice" aria-live="polite"></div>
<button id="save" type="button" class="btn">Save Test Pre-Order</button>
</section>

<section class="card">
<div class="actions"><h2 style="flex:1">Test Sunday Roast Orders</h2><button id="clear" type="button" class="btn secondary">Clear test orders</button></div>
<div id="orders"></div>
</section>
</main>
<script src="/sunday/core.js"></script>
<script src="/sunday/staff-manual-test.js"></script>
</body>
</html>
