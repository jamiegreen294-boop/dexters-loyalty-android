<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dexter's Epson Staff Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1526;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:680px;margin:auto;padding:16px}.c{background:#132038;border:1px solid #ffffff18;border-radius:16px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:13px;border-radius:12px;font-size:16px;margin-top:8px}input,select{background:#0d1829;color:#fff;border:1px solid #324866}button{border:0;font-weight:900;background:#ffd43b;color:#111}.p{background:#fff;padding:6px;border-radius:8px}.p img{display:block;width:100%;height:auto}.s{white-space:pre-wrap;color:#d8e0eb;margin-top:10px}
</style></head>
<body><div class="w">
<div class="c">
<h2>Dexter's Epson Loyalty Receipt Test</h2>
<div>This prints the exact approved receipt artwork shown below.</div>
<input id="ip" value="192.168.0.10">
<select id="proto"><option value="https">HTTPS</option><option value="http">HTTP</option></select>
<button id="open">Open Epson setup</button>
<button id="print">PRINT TEST RECEIPT</button>
<div id="st" class="s">Ready.</div>
</div>
<div class="c"><div class="p"><img id="art" crossorigin="anonymous" src="dexters-approved-receipt-exact.png"></div></div>
</div>
<script>
const $=i=>document.getElementById(i);function msg(t){$('st').textContent=t}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
async function raster(){return await new Promise((res,rej)=>{const im=$('art');const go=()=>{try{const w=576,h=Math.round(im.naturalHeight*w/im.naturalWidth),cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h).data,row=w>>3,out=new Uint8Array(row*h);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4,lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];if(lum<180)out[y*row+(xx>>3)]|=128>>(xx&7)}res({w,h,data:b64(out)})}catch(e){rej(e)}};if(im.complete&&im.naturalWidth)go();else{im.onload=go;im.onerror=()=>rej(Error('Receipt artwork failed to load'))}})}
async function xml(){const r=await raster();const body='<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print"><image width="'+r.w+'" height="'+r.h+'" color="color_1" mode="mono">'+r.data+'</image><feed line="3"/><cut type="feed"/></epos-print>';return '<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>'+body+'</s:Body></s:Envelope>'}
$('open').onclick=()=>window.open($('proto').value+'://'+$('ip').value.trim()+'/','_blank');
$('print').onclick=async()=>{const ip=$('ip').value.trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)){msg('Enter a valid Epson IP address.');return}const url=$('proto').value+'://'+ip+'/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000';msg('Sending exact approved receipt to Epson…');$('print').disabled=true;try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8','SOAPAction':'""'},body:await xml(),cache:'no-store',credentials:'omit'});const t=await r.text();if(!r.ok)throw Error('Printer returned HTTP '+r.status);if(/success=["']false/i.test(t))throw Error('Epson reported a print error');msg('Sent. Check the printed receipt matches the preview.')}catch(e){msg('Print failed: '+e.message+'\nIf using HTTPS, tap Open Epson setup first and accept the local printer certificate warning.')}finally{$('print').disabled=false}};
</script></body></html>
