<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dexter's Seasonal Pre-Order</title><link rel="stylesheet" href="/sunday/style.css"><style>
.eventHero{padding:22px;border-radius:22px;background:linear-gradient(145deg,#15110b,#080706);border:1px solid #9d772b;margin-bottom:16px}.eventHero h1{margin:.2em 0;color:#f5d37d}.eventHero .eventDate{font-weight:900;color:#f0c861}.orderGrid{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-weight:800}.courseGrid{display:grid;gap:12px}.extraRow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff17}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:9px;border:1px solid #9d772b;background:#18130b;color:#fff;font-weight:900}.qty output{min-width:24px;text-align:center}.hidden{display:none!important}.historyItem{padding:12px 0;border-bottom:1px solid #ffffff17}.payStatus{font-weight:900;color:#f0c861}.notice{padding:12px;border-radius:12px;background:#5a2b1d55;border:1px solid #a75d3d;margin:12px 0}.row.total{font-size:1.1em}.btn[disabled]{opacity:.5}.small{font-size:.9em;opacity:.82}</style></head><body><main class="wrap">
<div class="toolbar"><a href="/">← Home</a><span class="eyebrow">Collection pre-order</span></div>
<section class="eventHero"><p class="eyebrow" id="eyebrow">Dexter's Pre-Order</p><h1 id="title">Loading…</h1><p id="intro"></p><p class="eventDate" id="eventDate"></p></section>
<div id="closed" class="notice hidden"></div>
<section class="card"><h2>Build your pre-order</h2><div class="orderGrid">
<div class="field"><label for="mode">Choose your meal/deal</label><select class="input" id="mode"></select></div>
<div id="courseFields" class="courseGrid">
<div class="field"><label for="starter">Starter</label><select class="input" id="starter"></select></div>
<div class="field"><label for="main">Main</label><select class="input" id="main"></select></div>
<div class="field"><label for="dessert">Dessert</label><select class="input" id="dessert"></select></div>
</div>
<div><h3>Extras</h3><div id="extras"></div></div>
</div></section>
<section class="card"><h2>Your collection</h2><label for="slot">Collection time</label><select class="input" id="slot"></select><label for="name">Full name</label><input class="input" id="name" autocomplete="name"><label for="phone">Phone number</label><input class="input" id="phone" type="tel" autocomplete="tel"><p class="small" id="deadline"></p></section>
<section class="card"><h2>Your pre-order</h2><div id="summary"></div><div class="row total"><span>Total</span><strong id="total">£0.00</strong></div><div class="row"><span>Deposit</span><strong id="deposit">£0.00</strong></div><p id="message" role="status"></p><button class="btn" id="review">Review pre-order</button></section>
<section class="card"><h2>Your seasonal pre-orders</h2><div id="history"><p class="muted">Loading…</p></div></section>
</main>
<dialog id="confirm"><h2 id="confirmTitle">Confirm pre-order</h2><div id="reviewBody"></div><label><strong>How would you like to pay?</strong><select class="input" id="paymentChoice"><option value="deposit">Pay deposit now</option><option value="full">Pay in full now</option></select></label><p class="muted">Your deposit is deducted from the total. Remaining balance is payable later or on collection.</p><p id="confirmError" role="alert"></p><button class="btn" id="place">Continue to secure Square payment</button><button class="btn secondary" id="cancel">Go back</button></dialog>
<script src="/seasonal/api.js"></script><script src="/seasonal/customer.js"></script></body></html>
